      tl.fromTo("#e39", { y: 1149, x: 6, opacity: 0.38 }, { y: -60, x: 16, duration: 5.00, ease: "none" }, 0);
      tl.fromTo("#e39", { y: 2000, x: 0 }, { y: -60, x: 16, duration: 8.51, ease: "none", repeat: 2, immediateRender: false }, 5.00);
      tl.fromTo("#e40", { y: 1171, x: -3, opacity: 0.44 }, { y: -60, x: -8, duration: 4.65, ease: "none" }, 0);
      tl.fromTo("#e40", { y: 2000, x: 0 }, { y: -60, x: -8, duration: 7.79, ease: "none", repeat: 2, immediateRender: false }, 4.65);
      tl.fromTo("#e41", { y: 1678, x: 1, opacity: 0.53 }, { y: -60, x: 6, duration: 8.03, ease: "none" }, 0);
      tl.fromTo("#e41", { y: 2000, x: 0 }, { y: -60, x: 6, duration: 9.52, ease: "none", repeat: 2, immediateRender: false }, 8.03);
      tl.fromTo("#e42", { y: 1530, x: 12, opacity: 0.25 }, { y: -60, x: 54, duration: 7.44, ease: "none" }, 0);
      tl.fromTo("#e42", { y: 2000, x: 0 }, { y: -60, x: 54, duration: 9.64, ease: "none", repeat: 2, immediateRender: false }, 7.44);
      tl.fromTo("#e43", { y: 788, x: 2, opacity: 0.43 }, { y: -60, x: 3, duration: 4.67, ease: "none" }, 0);
      tl.fromTo("#e43", { y: 2000, x: 0 }, { y: -60, x: 3, duration: 11.35, ease: "none", repeat: 2, immediateRender: false }, 4.67);
      tl.fromTo("#e44", { y: 186, x: -35, opacity: 0.39 }, { y: -60, x: -40, duration: 0.91, ease: "none" }, 0);
      tl.fromTo("#e44", { y: 2000, x: 0 }, { y: -60, x: -40, duration: 7.64, ease: "none", repeat: 2, immediateRender: false }, 0.91);
      tl.fromTo("#e45", { y: 188, x: -9, opacity: 0.75 }, { y: -60, x: -10, duration: 1.25, ease: "none" }, 0);
      tl.fromTo("#e45", { y: 2000, x: 0 }, { y: -60, x: -10, duration: 10.37, ease: "none", repeat: 2, immediateRender: false }, 1.25);
      tl.fromTo("#e46", { y: 300, x: 5, opacity: 0.50 }, { y: -60, x: 6, duration: 1.76, ease: "none" }, 0);
      tl.fromTo("#e46", { y: 2000, x: 0 }, { y: -60, x: 6, duration: 10.07, ease: "none", repeat: 2, immediateRender: false }, 1.76);
      tl.fromTo("#e47", { y: 65, x: -41, opacity: 0.77 }, { y: -60, x: -43, duration: 0.68, ease: "none" }, 0);
      tl.fromTo("#e47", { y: 2000, x: 0 }, { y: -60, x: -43, duration: 11.20, ease: "none", repeat: 2, immediateRender: false }, 0.68);

      /* pulse helper: background reacts on every cut */
      const pulse = (t, a = .9) => tl.fromTo("#flash", { opacity: a }, { opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, t);
      const blurIn = (sel, t, st = 0.06) => tl.fromTo(sel, { yPercent: 110, opacity: 0, filter: "blur(14px)" }, { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: E, stagger: st }, t);

      /* ======== 1  hook (0 – 2.95) ======== */
      tl.fromTo("#stage", { scale: 1.08 }, { scale: 1, duration: 1.4, ease: E }, 0);
      pulse(0, 1);
      tl.fromTo("#t1a", { yPercent: 110, opacity: 0, filter: "blur(16px)", scale: 1.25 }, { yPercent: 0, opacity: 1, filter: "blur(0px)", scale: 1, duration: 1.0, ease: E }, 0.05);
      blurIn("#t1b", 1.18); blurIn("#t1c", 1.78); blurIn("#t1d", 2.1);
      tl.to("#t1", { scale: 1.04, duration: 2.85, ease: "none" }, 0);
      // zoom-through to 2
      tl.to("#t1", { scale: 2.6, opacity: 0, filter: "blur(24px)", duration: 0.45, ease: "power3.in" }, 2.85);

      /* ======== 2  Sie wird gemacht. (3.1 – 4.75) ======== */
      tl.fromTo("#t2", { scale: 0.55, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: E }, 3.08);
      tl.fromTo(["#t2a", "#t2b"], { yPercent: 0 }, { yPercent: 0, duration: 0.01 }, 3.08);
      tl.set("#t2c", { yPercent: 115 }, 0);
      tl.to("#t2c", { yPercent: 0, duration: 0.55, ease: "back.out(1.6)" }, 3.55);
      pulse(3.58, 1);
      tl.fromTo("#t2", { x: 0 }, { keyframes: [{ x: -10, duration: 0.04 }, { x: 8, duration: 0.04 }, { x: -4, duration: 0.04 }, { x: 0, duration: 0.05 }] }, 3.6);
      tl.to("#t2", { scale: 1.06, duration: 0.9, ease: "none" }, 3.7);

      /* ======== swoosh wipe into pillars (4.45 – 5.0) ======== */
      tl.set(".band", { rotation: -24 }, 0);
      tl.fromTo("#band2", { y: 2300 }, { y: -900, duration: 0.75, ease: "power2.inOut" }, 4.32);
      tl.fromTo("#band1", { y: 2350 }, { y: -950, duration: 0.75, ease: "power2.inOut" }, 4.38);
      tl.set("#t2", { opacity: 0 }, 4.75);

      /* ======== 3  pillars (5.0 – 9.3) ======== */
      const CY = 860;                     // centre line of the active word
      const stops = [5.0, 6.06, 7.24, 8.38];
      tl.set("#pill", { opacity: 0 }, 0).set("#pill", { opacity: 1 }, 4.72);
      tl.set("#col", { y: CY - 0 }, 0);
      tl.set([".pw"], { opacity: 0.16, scale: 0.72, filter: "blur(3px)" }, 0);
      stops.forEach((t, i) => {
        const at = i === 0 ? 4.72 : t - 0.18;
        tl.to("#col", { y: CY - i * 220, duration: i === 0 ? 0.6 : 0.55, ease: i === 0 ? E : "power4.inOut" }, at);
        tl.to("#p" + i, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: E }, at + 0.08);
        if (i > 0) tl.to("#p" + (i - 1), { opacity: 0.16, scale: 0.72, filter: "blur(3px)", duration: 0.45, ease: "power2.out" }, at);
        if (i < 3) {
          tl.to("#barf", { scaleX: (i + 1) / 4, duration: 0.5, ease: E }, at + 0.1);
          tl.to("#dg", { yPercent: -(100 / 3) * i, duration: 0.45, ease: "power4.inOut" }, at);
        }
        pulse(t, i === 3 ? 1 : 0.55);
      });
      tl.fromTo(["#bar", "#count"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 4.95);
      // Wachstum: the counter leaves, the word owns the frame
      tl.to(["#bar", "#count"], { opacity: 0, y: 40, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, 8.2);
      tl.to(["#p0", "#p1", "#p2"], { opacity: 0, duration: 0.4 }, 8.4);
      tl.to("#p3", { scale: 1.12, duration: 0.9, ease: "power2.out" }, 8.4);
      // exit: the column flies up
      tl.to("#col", { y: CY - 660 - 900, duration: 0.55, ease: "power4.in" }, 9.05);
      tl.to("#p3", { filter: "blur(16px)", opacity: 0, duration: 0.5, ease: "power2.in" }, 9.1);

      /* ======== 4  Für Marken mit Anspruch. (9.45 – 11.75) ======== */
      tl.fromTo("#fm", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: E }, 9.42);
      tl.fromTo(["#fm1", "#fm2"], { yPercent: 0 }, { yPercent: 0, duration: 0.01 }, 9.42);
      tl.fromTo("#fmline", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: E }, 9.8);
      tl.set(["#fa1", "#fa2"], { yPercent: -110 }, 0);
      tl.to("#fa1", { yPercent: 0, duration: 0.5, ease: E }, 10.72);
      tl.to("#fa2", { yPercent: 0, duration: 0.55, ease: E }, 10.82);
      pulse(10.76, 0.8);
      // split exit: line flashes wide, the lines part
      tl.to("#fmline", { scaleX: 1.5, height: 2, opacity: 0, duration: 0.45, ease: "power3.in" }, 11.55);
      tl.to("#fm", { y: -220, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power3.in" }, 11.5);
      tl.to("#fa", { y: 220, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power3.in" }, 11.5);

      /* ======== 5  Deine Marke. Unser Fokus. (11.9 – 14.2) ======== */
      tl.set(["#dm1", "#dm2", "#uf1", "#uf2"], { yPercent: 115 }, 0);
      tl.to("#dm1", { yPercent: 0, duration: 0.6, ease: E }, 11.9);
      tl.to("#dm2", { yPercent: 0, duration: 0.6, ease: E }, 12.12);
      tl.to("#uf1", { yPercent: 0, duration: 0.6, ease: E }, 12.92);
      tl.to("#uf2", { yPercent: 0, duration: 0.6, ease: E }, 13.18);
      pulse(12.98, 0.8);
      tl.fromTo(["#dm", "#uf"], { scale: 1 }, { scale: 1.05, duration: 1.95, ease: "none" }, 11.9);
      // implode into a single point
      tl.to(["#dm", "#uf"], { scale: 0.05, opacity: 0, filter: "blur(12px)", duration: 0.5, ease: "power3.in" }, 13.85);
      tl.fromTo("#dot", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power2.out" }, 14.25);

      /* ======== 6  logo (14.55 – 18) ======== */
      tl.to("#dot", { scale: 40, opacity: 0, duration: 0.55, ease: "power3.out" }, 14.55);
      tl.fromTo("#ring", { scale: 0.1, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 0.9, ease: "power3.out" }, 14.55);
      pulse(14.55, 1);
      tl.fromTo("#logo svg", { clipPath: "inset(-5% 105% -5% -5%)" }, { clipPath: "inset(-5% -5% -5% -5%)", duration: 0.85, ease: E }, 14.58);
      tl.fromTo("#logo", { scale: 1.18, x: -60 }, { scale: 1, x: 0, duration: 0.85, ease: E }, 14.58);
      tl.set("#streak", { skewX: -18, opacity: 0 }, 0);
      tl.fromTo("#streak", { x: 120, opacity: 1 }, { x: 980, opacity: 1, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 15.05);
      tl.set("#streak", { opacity: 0 }, 15.86);
      tl.fromTo(".bl", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: E, stagger: 0.04 }, 15.0);
      tl.fromTo(".bl", { x: (i) => (i - 5) * 26 }, { x: 0, duration: 1.0, ease: E }, 15.0);
      tl.fromTo(["#tl1", "#tl2"], { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: E }, 15.45);
      tl.fromTo("#tag", { opacity: 0, y: 24, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: E }, 15.4);
      tl.fromTo("#logo", { y: 0 }, { y: -12, duration: 2.4, ease: "sine.inOut" }, 15.45);
      // breathe glow and fade out
      tl.to("#flash", { opacity: 0.35, duration: 1.0, ease: "sine.inOut" }, 15.6);
      tl.to("#stage", { opacity: 0, duration: 0.7, ease: "power2.in" }, 17.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
