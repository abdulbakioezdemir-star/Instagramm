<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="ui/gsap.min.js"></script>
    <style>
      @font-face { font-family: Sora; font-weight: 800; src: url(fonts/sora-latin-800-normal.woff2) format("woff2"); }
      @font-face { font-family: Sora; font-weight: 700; src: url(fonts/sora-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: Sora; font-weight: 600; src: url(fonts/sora-latin-600-normal.woff2) format("woff2"); }
      @font-face { font-family: Manrope; font-weight: 600; src: url(fonts/manrope-latin-600-normal.woff2) format("woff2"); }
      @font-face { font-family: Manrope; font-weight: 500; src: url(fonts/manrope-latin-500-normal.woff2) format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0c0705; }
      :root { --or: #ff7a00; --or2: #ff9a2e; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      .full { position: absolute; inset: 0; }

      /* ---------- living background ---------- */
      #bg { background: radial-gradient(120% 80% at 50% 45%, #1c0f08 0%, #0e0806 55%, #070403 100%); }
      .blob { position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform; }
      #b1 { width: 900px; height: 900px; left: -260px; top: 180px; background: radial-gradient(circle, rgba(255,110,0,.55), rgba(255,90,0,0) 65%); }
      #b2 { width: 1000px; height: 1000px; left: 420px; top: 900px; background: radial-gradient(circle, rgba(255,140,30,.42), rgba(255,100,0,0) 65%); }
      #b3 { width: 700px; height: 700px; left: 300px; top: -200px; background: radial-gradient(circle, rgba(200,60,0,.45), rgba(200,60,0,0) 65%); }
      #lines { position: absolute; inset: -120px; width: 1320px; height: 2160px; opacity: 1; filter: drop-shadow(0 0 8px rgba(255,122,0,.9)); }
      #lines path { fill: none; stroke-linecap: round; }
      #grid { position: absolute; left: -540px; right: -540px; bottom: -200px; height: 900px; transform-origin: 50% 100%;
              transform: perspective(700px) rotateX(64deg);
              background-image: linear-gradient(rgba(255,122,0,.22) 2px, transparent 2px), linear-gradient(90deg, rgba(255,122,0,.22) 2px, transparent 2px);
              background-size: 120px 120px; -webkit-mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,.6) 40%, transparent 85%); mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,.6) 40%, transparent 85%); }
      .ember { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #ffb46b; box-shadow: 0 0 12px 3px rgba(255,122,0,.7); }
      #flash { background: radial-gradient(60% 40% at 50% 46%, rgba(255,140,40,.55), rgba(255,100,0,0) 70%); opacity: 0; mix-blend-mode: screen; }
      #vig { background: radial-gradient(110% 75% at 50% 48%, rgba(0,0,0,0) 45%, rgba(0,0,0,.7) 100%); }
      #grain { opacity: .07; mix-blend-mode: overlay; background-size: 256px 256px; }

      /* ---------- type ---------- */
      .h { font-family: Sora; font-weight: 800; color: #fff; letter-spacing: -0.02em; line-height: 1.02; text-align: center; width: 1080px; left: 0; }
      .o { color: var(--or); text-shadow: 0 0 40px rgba(255,122,0,.35); }
      .w { display: inline-block; will-change: transform, opacity, filter; }
      .mask { overflow: hidden; display: block; padding: 0 0 0.12em; }
      #t1 { top: 760px; font-size: 118px; }
      #t2 { top: 700px; font-size: 168px; }
      /* pillars */
      #pill { top: 0; left: 0; width: 1080px; height: 1920px; }
      #col { position: absolute; left: 0; width: 1080px; top: 0; }
      .pw { position: absolute; left: 0; width: 1080px; height: 220px; line-height: 220px; font-size: 150px; text-align: center; font-family: Sora; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
      #count { top: 1120px; width: 1080px; left: 0; text-align: center; font-family: Manrope; font-weight: 600; font-size: 30px; letter-spacing: .32em; color: rgba(255,255,255,.75); }
      #bar { top: 1090px; left: 390px; width: 300px; height: 4px; background: rgba(255,255,255,.14); border-radius: 2px; overflow: hidden; }
      #barf { width: 100%; height: 100%; background: var(--or); transform-origin: 0 50%; transform: scaleX(0); box-shadow: 0 0 14px var(--or); }
      .digits { display: inline-block; height: 1.2em; overflow: hidden; vertical-align: top; }
      .digits span span { display: block; height: 1.2em; line-height: 1.2em; } #dg { display: block; }
      /* für marken */
      #fm { top: 760px; font-size: 116px; }
      #fmline { top: 905px; left: 170px; width: 740px; height: 5px; background: var(--or); box-shadow: 0 0 22px rgba(255,122,0,.8); border-radius: 3px; }
      #fa { top: 935px; font-size: 116px; }
      #dm { top: 790px; font-size: 132px; }
      #uf { top: 945px; font-size: 132px; }
      /* sweep */
      .band { position: absolute; left: -600px; width: 2400px; height: 520px; border-radius: 260px; transform-origin: 50% 50%; }
      #band1 { background: linear-gradient(90deg, #ff6a00, #ff9a2e); box-shadow: 0 0 120px rgba(255,122,0,.8); }
      #band2 { background: #2a1408; }
      /* logo */
      #logo { left: 225px; top: 610px; width: 630px; filter: drop-shadow(0 0 36px rgba(255,122,0,.5)); }
      #rays { left: -460px; top: -100px; width: 2000px; height: 2000px; border-radius: 50%; background: conic-gradient(from 0deg, rgba(255,122,0,0) 0deg, rgba(255,122,0,.16) 12deg, rgba(255,122,0,0) 30deg, rgba(255,122,0,0) 60deg, rgba(255,150,40,.12) 75deg, rgba(255,122,0,0) 95deg, rgba(255,122,0,0) 150deg, rgba(255,122,0,.14) 165deg, rgba(255,122,0,0) 185deg, rgba(255,122,0,0) 240deg, rgba(255,150,40,.12) 252deg, rgba(255,122,0,0) 272deg, rgba(255,122,0,0) 360deg); -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.5) 35%, transparent 62%); mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.5) 35%, transparent 62%); filter: blur(6px); }
      #logo svg { width: 100%; display: block; }
      #streak { left: 0; top: 560px; width: 260px; height: 560px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,240,220,.85), rgba(255,255,255,0)); mix-blend-mode: overlay; opacity: 0; }
      #brand { top: 1030px; width: 1080px; left: 0; text-align: center; font-family: Sora; font-weight: 700; font-size: 92px; letter-spacing: .12em; color: #fff; }
      #tag { top: 1170px; width: 1080px; left: 0; text-align: center; font-family: Manrope; font-weight: 500; font-size: 32px; letter-spacing: .3em; color: rgba(255,255,255,.82); }
      .tl { position: absolute; top: 1190px; width: 110px; height: 3px; background: var(--or); }
      #tl1 { left: 70px; transform-origin: 100% 50%; } #tl2 { right: 70px; transform-origin: 0 50%; }
      #dot { left: 528px; top: 900px; width: 24px; height: 24px; border-radius: 50%; background: var(--or); box-shadow: 0 0 40px 12px rgba(255,122,0,.8); opacity: 0; }
      #ring { left: 340px; top: 712px; width: 400px; height: 400px; border-radius: 50%; border: 4px solid var(--or); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-fps="30" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="18" data-track-index="1">
        <!-- background -->
        <div id="bg" class="full">
          <div id="b1" class="blob"></div><div id="b2" class="blob"></div><div id="b3" class="blob"></div>
          <div id="rays" class="abs"></div>
          <div id="grid"></div>
          <svg id="lines" viewBox="0 0 1320 2160">
            <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#ff7a00" stop-opacity="0"/><stop offset=".5" stop-color="#ff8a1a" stop-opacity=".9"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/></linearGradient></defs>
            <path id="l1" d="M-100,1500 C300,1250 700,1200 1420,700" stroke="url(#lg)" stroke-width="3"/>
            <path id="l2" d="M-100,1640 C350,1380 800,1330 1420,860" stroke="url(#lg)" stroke-width="3"/>
            <path id="l3" d="M-100,560 C400,420 900,520 1420,240" stroke="url(#lg)" stroke-width="3"/>
            <path id="l5" d="M-100,1150 C380,980 820,1010 1420,520" stroke="url(#lg)" stroke-width="3"/>
            <path id="l6" d="M-100,300 C450,200 950,300 1420,40" stroke="url(#lg)" stroke-width="3"/>
            <path id="l4" d="M-100,1800 C400,1560 900,1520 1420,1060" stroke="url(#lg)" stroke-width="5" opacity=".5"/>
          </svg>
          {EMBERS}
          <div id="flash" class="full"></div>
        </div>

        <!-- 1 hook -->
        <div id="t1" class="abs h">
          <span class="mask"><span class="w" id="t1a">Aufmerksamkeit</span></span>
          <span class="mask o"><span class="w" id="t1b">ist</span> <span class="w" id="t1c">kein</span> <span class="w" id="t1d">Zufall.</span></span>
        </div>
        <!-- 2 -->
        <div id="t2" class="abs h">
          <span class="mask"><span class="w" id="t2a">Sie</span> <span class="w" id="t2b">wird</span></span>
          <span class="mask o"><span class="w" id="t2c">gemacht.</span></span>
        </div>
        <!-- 3 pillars -->
        <div id="pill" class="abs">
          <div id="col">
            <div class="pw" id="p0" style="top:0">Strategie.</div>
            <div class="pw" id="p1" style="top:220px">Content.</div>
            <div class="pw" id="p2" style="top:440px">Reichweite.</div>
            <div class="pw o" id="p3" style="top:660px;color:#ff7a00">Wachstum.</div>
          </div>
          <div id="bar" class="abs"><div id="barf"></div></div>
          <div id="count" class="abs"><span class="digits"><span id="dg"><span>01</span><span>02</span><span>03</span></span></span> / 04</div>
        </div>
        <!-- 4 -->
        <div id="fm" class="abs h"><span class="mask"><span class="w" id="fm1">Für</span> <span class="w" id="fm2">Marken</span></span></div>
        <div id="fmline" class="abs"></div>
        <div id="fa" class="abs h o"><span class="mask"><span class="w" id="fa1">mit</span> <span class="w" id="fa2">Anspruch.</span></span></div>
        <!-- 5 -->
        <div id="dm" class="abs h"><span class="mask"><span class="w" id="dm1">Deine</span> <span class="w" id="dm2">Marke.</span></span></div>
        <div id="uf" class="abs h o"><span class="mask"><span class="w" id="uf1">Unser</span> <span class="w" id="uf2">Fokus.</span></span></div>
        <!-- 6 logo -->
        <div id="dot" class="abs"></div>
        <div id="ring" class="abs"></div>
        <div id="logo" class="abs">{LOGO}</div>
        <div id="streak" class="abs"></div>
        <div id="brand" class="abs">{BRAND}</div>
        <div id="tl1" class="tl"></div><div id="tl2" class="tl"></div>
        <div id="tag" class="abs">SOCIAL MEDIA MANAGEMENT</div>

        <!-- wipe bands sit over everything -->
        <div id="band2" class="band"></div>
        <div id="band1" class="band"></div>
        <div id="vig" class="full"></div>
        <div id="grain" class="full" style="background-image:url(ui/grain.png)"></div>
      </div>

      <audio id="vo" class="clip" src="audio/original.wav" data-start="0" data-duration="18" data-track-index="20" data-volume="1"></audio>
      {SFX}
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const E = "expo.out", P3 = "power3.inOut";

      /* ======== background: always moving ======== */
      tl.fromTo("#b1", { x: 0, y: 0, scale: 1 }, { x: 380, y: -260, scale: 1.25, duration: 9, ease: "sine.inOut" }, 0)
        .to("#b1", { x: 120, y: 340, scale: .95, duration: 9, ease: "sine.inOut" }, 9)
        .fromTo("#b2", { x: 0, y: 0 }, { x: -520, y: -380, duration: 10, ease: "sine.inOut" }, 0)
        .to("#b2", { x: -160, y: -820, duration: 8, ease: "sine.inOut" }, 10)
        .fromTo("#b3", { x: 0, y: 0, scale: 1 }, { x: -260, y: 420, scale: 1.4, duration: 18, ease: "sine.inOut" }, 0)
        .fromTo("#grid", { backgroundPosition: "0px 0px" }, { backgroundPosition: "0px 1440px", duration: 18, ease: "none" }, 0)
        .fromTo("#lines", { x: -60, y: 40 }, { x: 60, y: -80, duration: 18, ease: "none" }, 0)
        .fromTo("#rays", { rotation: 0 }, { rotation: 75, duration: 18, ease: "none" }, 0);
      ["#l1", "#l2", "#l3", "#l4", "#l5", "#l6"].forEach((id, i) => {
        tl.fromTo(id, { strokeDasharray: "420 1800", strokeDashoffset: 2200 - i * 400 }, { strokeDashoffset: -1800 - i * 300, duration: 6 + i * 1.3, ease: "none", repeat: Math.ceil(18 / (6 + i * 1.3)) }, i * 0.4);
      });
      {EMBER_JS}

      /* pulse helper: background reacts on every cut */
      const pulse = (t, a = .9) => tl.fromTo("#flash", { opacity: a }, { opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, t);
      const blurIn = (sel, t, st = 0.06) => tl.fromTo(sel, { yPercent: 110, opacity: 0, filter: "blur(14px)" }, { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: E, stagger: st }, t);

      /* ======== 1  hook (0 – 2.95) ======== */
      tl.fromTo("#stage", { scale: 1.08 }, { scale: 1, duration: 1.4, ease: E }, 0);
      pulse(0, 1);
      tl.fromTo("#t1a", { yPercent: 110, opacity: 0, filter: "blur(16px)", scale: 1.25 }, { yPercent: 0, opacity: 1, filter: "blur(0px)", scale: 1, duration: 1.0, ease: E }, 0.05);
      blurIn("#t1b", 1.18); blurIn("#t1c", 1.78); blurIn("#t1d", 2.1);
      tl.to("#t1", { scale: 1.04, duration: 2.85, ease: "none" }, 0);
      // zoom-through to 2
      tl.to("#t1", { scale: 2.6, opacity: 0, filter: "blur(24px)", duration: 0.45, ease: "power3.in" }, 2.85);

      /* ======== 2  Sie wird gemacht. (3.1 – 4.75) ======== */
      tl.fromTo("#t2", { scale: 0.55, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: E }, 3.08);
      tl.fromTo(["#t2a", "#t2b"], { yPercent: 0 }, { yPercent: 0, duration: 0.01 }, 3.08);
      tl.set("#t2c", { yPercent: 115 }, 0);
      tl.to("#t2c", { yPercent: 0, duration: 0.55, ease: "back.out(1.6)" }, 3.55);
      pulse(3.58, 1);
      tl.fromTo("#t2", { x: 0 }, { keyframes: [{ x: -10, duration: 0.04 }, { x: 8, duration: 0.04 }, { x: -4, duration: 0.04 }, { x: 0, duration: 0.05 }] }, 3.6);
      tl.to("#t2", { scale: 1.06, duration: 0.9, ease: "none" }, 3.7);

      /* ======== swoosh wipe into pillars (4.45 – 5.0) ======== */
      tl.set(".band", { rotation: -24 }, 0);
      tl.fromTo("#band2", { y: 2300 }, { y: -900, duration: 0.75, ease: "power2.inOut" }, 4.32);
      tl.fromTo("#band1", { y: 2350 }, { y: -950, duration: 0.75, ease: "power2.inOut" }, 4.38);
      tl.set("#t2", { opacity: 0 }, 4.75);

      /* ======== 3  pillars (5.0 – 9.3) ======== */
      const CY = 860;                     // centre line of the active word
      const stops = [5.0, 6.06, 7.24, 8.38];
      tl.set("#pill", { opacity: 0 }, 0).set("#pill", { opacity: 1 }, 4.72);
      tl.set("#col", { y: CY - 0 }, 0);
      tl.set([".pw"], { opacity: 0.16, scale: 0.72, filter: "blur(3px)" }, 0);
      stops.forEach((t, i) => {
        const at = i === 0 ? 4.72 : t - 0.18;
        tl.to("#col", { y: CY - i * 220, duration: i === 0 ? 0.6 : 0.55, ease: i === 0 ? E : "power4.inOut" }, at);
        tl.to("#p" + i, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: E }, at + 0.08);
        if (i > 0) tl.to("#p" + (i - 1), { opacity: 0.16, scale: 0.72, filter: "blur(3px)", duration: 0.45, ease: "power2.out" }, at);
        if (i < 3) {
          tl.to("#barf", { scaleX: (i + 1) / 4, duration: 0.5, ease: E }, at + 0.1);
          tl.to("#dg", { yPercent: -(100 / 3) * i, duration: 0.45, ease: "power4.inOut" }, at);
        }
        pulse(t, i === 3 ? 1 : 0.55);
      });
      tl.fromTo(["#bar", "#count"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 4.95);
      // Wachstum: the counter leaves, the word owns the frame
      tl.to(["#bar", "#count"], { opacity: 0, y: 40, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, 8.2);
      tl.to(["#p0", "#p1", "#p2"], { opacity: 0, duration: 0.4 }, 8.4);
      tl.to("#p3", { scale: 1.12, duration: 0.9, ease: "power2.out" }, 8.4);
      // exit: the column flies up
      tl.to("#col", { y: CY - 660 - 900, duration: 0.55, ease: "power4.in" }, 9.05);
      tl.to("#p3", { filter: "blur(16px)", opacity: 0, duration: 0.5, ease: "power2.in" }, 9.1);

      /* ======== 4  Für Marken mit Anspruch. (9.45 – 11.75) ======== */
      tl.fromTo("#fm", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: E }, 9.42);
      tl.fromTo(["#fm1", "#fm2"], { yPercent: 0 }, { yPercent: 0, duration: 0.01 }, 9.42);
      tl.fromTo("#fmline", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: E }, 9.8);
      tl.set(["#fa1", "#fa2"], { yPercent: -110 }, 0);
      tl.to("#fa1", { yPercent: 0, duration: 0.5, ease: E }, 10.72);
      tl.to("#fa2", { yPercent: 0, duration: 0.55, ease: E }, 10.82);
      pulse(10.76, 0.8);
      // split exit: line flashes wide, the lines part
      tl.to("#fmline", { scaleX: 1.5, height: 2, opacity: 0, duration: 0.45, ease: "power3.in" }, 11.55);
      tl.to("#fm", { y: -220, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power3.in" }, 11.5);
      tl.to("#fa", { y: 220, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power3.in" }, 11.5);

      /* ======== 5  Deine Marke. Unser Fokus. (11.9 – 14.2) ======== */
      tl.set(["#dm1", "#dm2", "#uf1", "#uf2"], { yPercent: 115 }, 0);
      tl.to("#dm1", { yPercent: 0, duration: 0.6, ease: E }, 11.9);
      tl.to("#dm2", { yPercent: 0, duration: 0.6, ease: E }, 12.12);
      tl.to("#uf1", { yPercent: 0, duration: 0.6, ease: E }, 12.92);
      tl.to("#uf2", { yPercent: 0, duration: 0.6, ease: E }, 13.18);
      pulse(12.98, 0.8);
      tl.fromTo(["#dm", "#uf"], { scale: 1 }, { scale: 1.05, duration: 1.95, ease: "none" }, 11.9);
      // implode into a single point
      tl.to(["#dm", "#uf"], { scale: 0.05, opacity: 0, filter: "blur(12px)", duration: 0.5, ease: "power3.in" }, 13.85);
      tl.fromTo("#dot", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power2.out" }, 14.25);

      /* ======== 6  logo (14.55 – 18) ======== */
      tl.to("#dot", { scale: 40, opacity: 0, duration: 0.55, ease: "power3.out" }, 14.55);
      tl.fromTo("#ring", { scale: 0.1, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 0.9, ease: "power3.out" }, 14.55);
      pulse(14.55, 1);
      tl.fromTo("#logo svg", { clipPath: "inset(-5% 105% -5% -5%)" }, { clipPath: "inset(-5% -5% -5% -5%)", duration: 0.85, ease: E }, 14.58);
      tl.fromTo("#logo", { scale: 1.18, x: -60 }, { scale: 1, x: 0, duration: 0.85, ease: E }, 14.58);
      tl.set("#streak", { skewX: -18, opacity: 0 }, 0);
      tl.fromTo("#streak", { x: 120, opacity: 1 }, { x: 980, opacity: 1, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 15.05);
      tl.set("#streak", { opacity: 0 }, 15.86);
      tl.fromTo(".bl", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: E, stagger: 0.04 }, 15.0);
      tl.fromTo(".bl", { x: (i) => (i - 5) * 26 }, { x: 0, duration: 1.0, ease: E }, 15.0);
      tl.fromTo(["#tl1", "#tl2"], { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: E }, 15.45);
      tl.fromTo("#tag", { opacity: 0, y: 24, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: E }, 15.4);
      tl.fromTo("#logo", { y: 0 }, { y: -12, duration: 2.4, ease: "sine.inOut" }, 15.45);
      // breathe glow and fade out
      tl.to("#flash", { opacity: 0.35, duration: 1.0, ease: "sine.inOut" }, 15.6);
      tl.to("#stage", { opacity: 0, duration: 0.7, ease: "power2.in" }, 17.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
