    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1410"/><stop offset=".62" stop-color="#18231c"/><stop offset="1" stop-color="#2a3a2e"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#b8cfbc" stop-opacity=".55"/><stop offset="1" stop-color="#b8cfbc" stop-opacity="0"/></radialGradient>
    <linearGradient id="sideL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#18231c"/><stop offset="1" stop-color="#2c3d31"/></linearGradient>
    <linearGradient id="sideR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#18231c"/><stop offset="1" stop-color="#2c3d31"/></linearGradient>
