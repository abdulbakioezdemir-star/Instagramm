<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #070b08; }
    #ein-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  <div id="root" data-composition-id="eingang" data-width="1080" data-height="1920" data-layout-allow-overflow>
    <div id="ein-cam">

      </div>
      <img class="ein-full" src="assets/img/door-frame.svg">

  <script>
    const tl = gsap.timeline({ paused: true });
    const pad = (n) => String(n).padStart(2, "0");
    const fmt = (s) => `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(Math.floor(s) % 60)}`;
    const tc = document.querySelector("#ein-tc");
    const c = { t: 0 };
    tl.fromTo(c, { t: 0 }, { t: 4.5, duration: 4.5, ease: "none", onUpdate() { tc.textContent = fmt(3 * 3600 + 17 * 60 + 31 + c.t); } }, 0);

    // arrives from the zoom slightly large, then settles
    tl.fromTo("#ein-cam", { scale: 1.06, filter: "blur(5px)" }, { scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0);
    // second figure walks up outside
    tl.fromTo("#ein-f2o", { x: 0 }, { x: -245, duration: 1.4, ease: "power1.out" }, 0.3);
    tl.fromTo("#ein-f2o", { y: 0 }, { y: -10, duration: 0.23, ease: "sine.inOut", repeat: 5, yoyo: true }, 0.3);
    // the door swings open
    tl.fromTo("#ein-leaf", { rotationY: 0, transformOrigin: "100% 50%", transformPerspective: 1400 },
      { rotationY: 72, duration: 0.8, ease: "power2.inOut" }, 1.0);
    // figure 1 steps through: swap the clipped outside copy for the inside one, then walk toward the camera
    tl.set("#ein-f1o", { opacity: 0 }, 1.9);
    tl.set("#ein-f1i", { opacity: 1 }, 1.9);
    tl.fromTo("#ein-f1i", { x: 0, y: 0, scale: 1, transformOrigin: "50% 100%" },
      { x: -420, y: 760, scale: 3.1, duration: 2.3, ease: "power2.in" }, 1.9);
    tl.set("#ein-f2o", { opacity: 0 }, 2.5);
    tl.set("#ein-f2i", { opacity: 1 }, 2.5);
    tl.fromTo("#ein-f2i", { x: 0, y: 0, scale: 1, transformOrigin: "50% 100%" },
      { x: 300, y: 700, scale: 2.8, duration: 2.0, ease: "power2.in" }, 2.5);
    // line
    tl.fromTo("#ein-line .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, 0.8);
    tl.to("#ein-line", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, 3.9);
    window.__timelines["eingang"] = tl;
