/* ================================================================== RENDER ================================================================== */
function look(p, tg) { cam.position.set(p[0], p[1], p[2]); cam.up.set(0, 1, 0); cam.lookAt(tg[0], tg[1], tg[2]); }

function world1(t) {

                [b(4.5), [-50, -80, 330]], [b(6), [-150, -60, 620]], [3.3, [-160, -560, 820]],
                [b(8), [140, -560, 700]], [b(9), [-470, -420, 640]], [b(10), [-260, -760, 980]], [CUBE, [-160, -1500, 6400], 'i']];
    const CT = [[0, [0, 0, 0]], [b(1), [0, 0, 0], 'o'], [0.98, [0, -60, 0]], [b(3), [-90, -70, 30]], [1.82, [-140, 140, 20]],
                [b(4.5), [-160, 320, 0]], [b(6), [-160, 356, 20]], [3.3, IC], [b(8), IC], [b(9), IC], [b(10), IC], [CUBE, IC, 'i']];

  { const u = seg(t, b(15.5) - .06, .3, 'o'), out = seg(t, b(17) - .16, .2, 'i');
    W2.gr.position.set(-1150 * (1 - u) + 1150 * out, 10, 0); W2.gr.rotation.set(0, -.75 * (1 - u) - .14 + .3 * seg(t, b(15.5) + .24, b(17) - b(15.5), 'l'), 0); setOp(W2.gr, Math.min(u * 1.5, 1) * (1 - out)); }

function world3(t) {
  rp.scene = bokeh.scene = W3.scene;
  bloom.strength = 0;
  const END = b(26);
  // camera swings from line to line, then settles straight on for the logo
  const px = K(t, [[b(19), -300], [b(20.5) + .1, 260], [b(22) + .1, -240], [b(23.5) + .1, 220], [b(25) + .1, -150], [END + .4, 0]]);
  const p = [px, K(t, [[b(19), 40], [END, -30], [END + .4, 0]]), K(t, [[b(19), D + 200], [END, D - 120, 'l'], [END + .5, D], [DUR, D - 120, 'l']])];
  look(p, [0, 0, 0]);
  const logoT = b(28);
  const base = Math.hypot(p[0], p[1], p[2]);
  dof(K(t, [[logoT - .05, base], [logoT, base - 1300], [logoT + .8, base, 'o']]), t < logoT ? .00004 : .00006, t < logoT ? .012 : .02);
  W3.col.position.y = K(t, [[b(20.5) - .14, 0], [b(20.5) + .12, 110], [b(22) - .14, 110], [b(22) + .12, 325], [b(23.5) - .14, 325], [b(23.5) + .12, 570], [b(25) - .14, 570], [b(25) + .12, 680]]);
  const starts = [b(19), b(20.5), b(22), b(23.5), b(25)];
  const away = seg(t, END + .05, .45, 'i');                     // the sentence dissolves once its full stop ignites
  W3.lines.forEach((m, i) => {
    const on = seg(t, starts[i] - .04, .34, 'back');
    const next = i < 3 ? starts[i + 1] : 99, next2 = i < 3 ? (starts[i + 2] || 99) : 99;
    const back = seg(t, next - .14, .3), gone = seg(t, next2 - .14, .26);
    m.position.z = -380 * back - 300 * gone - 500 * (i >= 3 ? away : 0);
    m.rotation.x = -.9 * (1 - on); m.position.x = 0;
    m.scale.setScalar(Math.max(.001, .75 + .25 * cl(on)));
    setOp(m, cl(on * 1.4) * (1 - .62 * back) * (1 - gone) * (i >= 3 ? 1 - away : 1));
  });
  { const a = b(23.5) + .02, gi = t > a && t < a + .2; const k = Math.floor((t - a) * 60) % 3;
    W3.g1.visible = W3.g2.visible = gi; W3.g1.position.x = [-16, 12, -7][k]; W3.g2.position.x = [16, -12, 7][k]; }

  else if (t < b(28.8)) { const ang = Math.PI / 2 - dr * Math.PI * 2; sx = RC[0] + R * Math.cos(ang); sy = RC[1] + R * Math.sin(ang); }

  W3.spark.position.set(sx, sy, 30);
  const sOut = seg(t, b(29.1), .3);

  W3.spark.scale.setScalar(Math.max(.001, ign * pulse * (1 + .5 * (1 - fly) * ign) * (1 - .6 * land)));

  const lo = seg(t, logoT - .04, .55, 'o');
  setOp(W3.logo, lo * (1 - fade)); W3.logo.scale.setScalar(1.07 - .07 * lo);
  W3.lline.scale.x = Math.max(.001, seg(t, b(29), .45, 'o')); setOp(W3.lline, (W3.lline.scale.x > .01 ? 1 : 0) * (1 - fade));
  const fy = (o, y0, a) => { const u = seg(t, a, .45, 'o'); o.position.y = y0 - 24 * (1 - u); setOp(o, u * (1 - fade)); };
  fy(W3.rl, -290, b(30) - .05); fy(W3.cl1, -405, b(31.5)); fy(W3.cl2, -462, b(31.5) + .12); fy(W3.hd, -560, b(32.6));
}

function renderAt(t) {
  t = Math.max(0, Math.min(DUR - 1e-4, t));
  document.getElementById('oval').style.opacity = 0;
  if (t < b(13)) world1(t); else if (t < b(19)) world2(t); else world3(t);
  composer.render();
}

let ready = false;
window.__hf.buildReady['three'] = build().then(() => { ready = true; renderAt(0); });
window.addEventListener('hf-seek', e => { if (ready) renderAt(e.detail.time); else e.detail.waitUntil && e.detail.waitUntil(window.__hf.buildReady['three'].then(() => renderAt(e.detail.time))); });
