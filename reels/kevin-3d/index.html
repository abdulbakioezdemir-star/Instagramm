  const neon = (s, size, core, glow) => plane(textTex(s, { size, color: core, glow, pad: 90 }), { hdr: 1.12 });
  W3.lines = [neon('Klarheit.', 175, '#c4e2ff', 'rgba(40,120,255,1)'), neon('Fokus.', 185, '#ffeb85', 'rgba(255,200,0,1)'), neon('Leistung.', 175, '#ffd690', 'rgba(255,150,10,1)'),
              neon('Grenzen sind', 132, '#ff7a6a', 'rgba(255,30,10,1)'), neon('im Kopf.', 176, '#ff7a6a', 'rgba(255,30,10,1)')];
  W3.ly = [0, -215, -430, -670, -860];
  W3.lines.forEach((m, i) => { m.position.y = W3.ly[i]; col.add(m); });
  W3.g1 = plane(textTex('Grenzen sind', { size: 132, color: 'rgba(0,230,255,.8)', pad: 90 }), { hdr: 1.3, add: true }); W3.g1.position.y = W3.ly[3]; col.add(W3.g1);
  W3.g2 = plane(textTex('Grenzen sind', { size: 132, color: 'rgba(255,40,140,.8)', pad: 90 }), { hdr: 1.3, add: true }); W3.g2.position.y = W3.ly[3]; col.add(W3.g2);
  // bars: metal cylinders on an arc around the camera
  W3.bars = []; const barM = new THREE.MeshStandardMaterial({ color: 0x6a717c, metalness: 1, roughness: .32 });
  for (let i = 0; i < 15; i++) {
    const a = (i - 7) * 0.056, r = 2050; const m = new THREE.Mesh(new THREE.CylinderGeometry(21, 21, 5200, 32), barM);
    m.userData.home = [Math.sin(a) * r, 0, D - Math.cos(a) * r]; S3.add(m); W3.bars.push(m);
  }
  W3.logo = plane({ tex: texFromImg(IM['kn-logo']), w: 600, h: 600 * IM['kn-logo'].height / IM['kn-logo'].width }); W3.logo.position.y = 150; S3.add(W3.logo);
  W3.mc = []; { const s = 'MENTAL COACH'; let x = 0; const ts = s.split('').map(ch => ch === ' ' ? null : textTex(ch, { size: 54, weight: 500, color: '#e3c27a', pad: 10 }));
    const step = 60; x = -(s.length - 1) * step / 2;
    s.split('').forEach((ch, i) => { if (ts[i]) { const p = plane(ts[i]); p.position.set(x, -250, 0); S3.add(p); W3.mc.push(p); } x += step; }); }
  W3.hd = plane(textTex('@kevnsimba', { size: 32, weight: 500, color: '#8a857c', pad: 10 })); W3.hd.position.y = -350; S3.add(W3.hd);

  // warm-up: compile all three scenes once
  for (const s of [S1, S2, S3]) { rp.scene = s; bokeh.scene = s; await renderer.compileAsync(s, cam); composer.render(); }
  const px = new Uint8Array(4); renderer.readRenderTargetPixels(composer.readBuffer, 0, 0, 1, 1, px);
}

/* ================================================================== RENDER ================================================================== */
function look(p, tg) { cam.position.set(p[0], p[1], p[2]); cam.up.set(0, 1, 0); cam.lookAt(tg[0], tg[1], tg[2]); }
function dof(focus, ap, max) { bokeh.uniforms.focus.value = focus; bokeh.uniforms.aperture.value = ap; bokeh.uniforms.maxblur.value = max; }

function world1(t) {
  rp.scene = bokeh.scene = W1.scene;
  bloom.strength = 0.85; bloom.threshold = 1.0; bloom.radius = 0.5;
  const phoneOn = t < b(9);
  W1.ph.visible = phoneOn; W1.cubeG.visible = !phoneOn; W1.rows.visible = !phoneOn;
  // dust drifts upward
  const pa = W1.dust.geometry.attributes.position;
  W1.dust0.forEach((p, i) => { let y = p[1] + t * 70; y = ((y + 2600) % 5200) - 2600; pa.setXYZ(i, p[0], y, p[2]); }); pa.needsUpdate = true;
  if (phoneOn) {
    W1.ph.rotation.set(K(t, [[0, .16], [b(1), .07, 'o'], [b(3), 0]]), K(t, [[0, -.55], [b(1), -.24, 'o'], [b(3), 0]]), K(t, [[0, .09], [b(1), .04, 'o'], [b(3), 0]]));
    W1.sheen.offset.x = K(t, [[0, -.5], [1.2, .6, 'io']]);
    const CP = [[0, [0, 30, 5600]], [b(1), [0, -40, 3350], 'o'], [0.98, [420, -1650, 1450]], [b(3), [360, -760, 300]], [1.82, [70, -430, 250]],
                [b(4.5), [-50, -80, 330]], [b(6), [-150, -60, 620]], [3.3, [-160, -560, 820]], [b(8), [-160, -640, 880]], [b(9), [-160, -1300, 6200], 'i']];
    const CT = [[0, [0, 0, 0]], [b(1), [0, 0, 0], 'o'], [0.98, [0, -60, 0]], [b(3), [-90, -70, 30]], [1.82, [-140, 140, 20]],
                [b(4.5), [-160, 320, 0]], [b(6), [-160, 356, 20]], [3.3, [-160, 356, 170]], [b(8), [-160, 356, 205]], [b(9), [-160, 356, 205], 'i']];
    const p = K(t, CP), tg = K(t, CT); look(p, tg);
    const dist = Math.hypot(p[0] - tg[0], p[1] - tg[1], p[2] - tg[2]);
    dof(dist, K(t, [[0, .00001], [b(1), .000015], [1.1, .00004], [b(3), .00009], [b(6), .00007], [b(8), .00005], [b(9), .00001]]), K(t, [[0, .006], [1.1, .014], [b(3), .02], [b(8), .016], [b(9), .005]]));
    W1.fog.far = K(t, [[b(8), 1e6], [b(8) + 0.05, 9000], [b(9), 3000, 'i']]); W1.fog.near = 10;
    // panels and posts lift off the screen and float
    W1.tiles.forEach((m, i) => {
      const a = b(1) + 0.05 + i * 0.045, zt = 130 + (i * 53) % 120;
      const up = seg(t, a, 0.45, 'back'), dn = seg(t, b(3) - 0.38 + i * .03, 0.3, 'i');
      const fl = Math.sin(Math.max(0, t - a) * 5 + i) * 14 * up * (1 - dn);
      m.position.z = 2 + (zt * up + fl) * (1 - dn);
      m.rotation.x = (-0.12 + (i % 3) * 0.08) * up * (1 - dn); m.rotation.y = ((i % 2) ? .06 : -.06) * up * (1 - dn);
      W1.tileSh[i].material.opacity = 0.7 * up * (1 - dn);
    });
    W1.panels.forEach((m, i) => { const up = seg(t, b(1) + 0.18 + i * .05, .45, 'back'), dn = seg(t, b(3) - .35, .3, 'i'); m.position.z = 1 + [70, 95, 40][i] * up * (1 - dn); });
    // hologram rings + icon
    W1.rings.children.forEach((r, i) => { const s = seg(t, b(6) + i * .06, .5, 'expo'); r.scale.setScalar(Math.max(.001, s)); r.visible = s > 0.01;
      if (r.material) r.material.opacity = s * (0.85 + 0.15 * Math.sin(t * 9 + i)); });
    const ic = seg(t, b(6) + .05, .65, 'o');
    W1.icon.visible = ic > 0.001; W1.icon.scale.setScalar(Math.max(.001, .55 + .45 * ic));
    W1.icon.position.z = 8 + 225 * ic + Math.sin(Math.max(0, t - b(6)) * 3.2) * 10 * ic;
    W1.icon.rotation.set(0.82 * ic, 0.32 * Math.sin(Math.max(0, t - b(6)) * 2.4) * ic, 0);
  } else {
    // cube with orbiting letters
    look([Math.sin((t - b(9)) * .5) * 260, 90, 2300], [0, 0, 0]);
    dof(2300, .00002, .012);
    W1.fog.far = 1e6;
    const s = seg(t, b(9) - .05, .35, 'expo');
    W1.cube.rotation.set(-0.3, -0.5 + (t - b(9)) * 1.25 + seg(t, b(12.4), .4, 'i') * 2.2, 0.08);
    const sl = seg(t, b(12.5) - .02, .22, 'i');
    W1.cube.scale.set(Math.max(.02, s * (1 - .98 * sl)), Math.max(.02, s * (1 + .3 * sl)), Math.max(.02, s * (1 - .98 * sl)));
    W1.orbit.rotation.set(0.32, 0, -0.16);
    const col = seg(t, b(12), .35, 'i'), sIn = seg(t, b(9) + .1, .3, 'o');
    W1.letters.forEach((p, i) => { const th = (t - b(9)) * 2.2 + i / 7 * Math.PI * 2, r = 360 * (1 - col);
      p.position.set(Math.sin(th) * r, 0, Math.cos(th) * r); p.rotation.y = th; p.scale.setScalar(Math.max(.001, sIn * (1 - .9 * col))); setOp(p, sIn * (1 - col)); });
    W1.rows.position.x = -(t - b(9)) * 160;
    setOp(W1.rows, 0.14 * seg(t, b(9), .5));
  }
}

function world2(t) {
  rp.scene = bokeh.scene = W2.scene;
  bloom.strength = 0;
  const p = [K(t, [[b(13), 90], [b(19), -120, 'l']]), K(t, [[b(13), 20], [b(19), -40, 'l']]), K(t, [[b(13), D + 250], [b(18), D - 60, 'l'], [b(19), D - 300, 'i2']])];
  look(p, [p[0] * .4, p[1] * .4, 0]); cam.rotateZ(K(t, [[b(13), .03], [b(19), -.03, 'l']]));
  // focus follows the active word
  const fz = K(t, [[b(13), 0], [b(14) - .1, 0], [b(14), -120], [b(15.5) - .1, -120], [b(15.5), 0], [b(17.5) - .1, 0], [b(17.5), 40]]);
  dof(p[2] - fz, .00005, .012);
  // Jeder: letters tumble in
  W2.jeder.position.set(K(t, [[b(14) - .08, 0], [b(14) + .22, -70, 'o']]), K(t, [[b(14) - .08, 170], [b(14) + .22, 400, 'o'], [b(15) - .2, 400], [b(15) + .04, 1300, 'i']]), 0);
  W2.jeder.rotation.set(0, -.42, -.15);
  W2.jl.forEach((g, i) => { const u = seg(t, b(13) - .04 + i * .045, .32, 'back'); g.rotation.x = (-Math.PI / 2) * (1 - u); g.position.z = 0;
    g.children[0].position.y = 130 + 260 * (1 - cl(u)); setOp(g, cl(u * 3) * (1 - seg(t, b(15) - .2, .24))); });
  W2.jeder.visible = t < b(15.2);
  // Fußballer box
  { const u = seg(t, b(14) - .08, .3, 'o'), out = seg(t, b(15) - .2, .24, 'i');
    W2.fb.position.set(900 * (1 - u), -140 + 900 * out, -120); W2.fb.rotation.set(0, .85 - .6 * u, -.08); setOp(W2.fb, u * (1 - out)); }
  // hat + Grenzen.
  { const u = seg(t, b(15) - .04, .24, 'o'), out = seg(t, b(16) - .1, .18);
    W2.hat.position.set(-40, 250 - 150 * (1 - u) + 60 * out, 0); W2.hat.rotation.set(-1.1 * (1 - u), 0, 0); setOp(W2.hat, u * (1 - out)); }
  { const u = seg(t, b(15.5) - .06, .3, 'o'), out = seg(t, b(17) - .16, .2, 'i');
    W2.gr.position.set(-1150 * (1 - u) + 1150 * out, 10, 0); W2.gr.rotation.set(0, -.75 * (1 - u) - .14 + .3 * seg(t, b(15.5) + .24, b(17) - b(15.5), 'l'), 0); setOp(W2.gr, Math.min(u * 1.5, 1) * (1 - out)); }
  // Doch nicht / jeder / wird aufgehalten.
  { const u = seg(t, b(17) - .04, .26, 'o'); W2.doch.position.set(-800 * (1 - u), 270, -40); W2.doch.rotation.set(0, -.6 * (1 - u) - .26, .08); setOp(W2.doch, u); }
  { const u = seg(t, b(17.5) - .04, .26, 'o'); W2.jed2.position.set(800 * (1 - u), 50, 40); W2.jed2.rotation.set(0, .6 * (1 - u) + .2, -.07); setOp(W2.jed2, u); }
  { const u = seg(t, b(18) - .04, .26, 'o'); W2.wird.position.set(0, -190 - 220 * (1 - u), 20); W2.wird.rotation.set(-1 * (1 - u), 0, 0); setOp(W2.wird, u); }
  document.getElementById('oval').style.opacity = (t >= b(16) && t < b(17) - .02) ? 1 : 0;
}

function world3(t) {
  rp.scene = bokeh.scene = W3.scene;
  bloom.strength = 0.4; bloom.threshold = 1.05; bloom.radius = 0.3;
  const p = [K(t, [[b(19), -60], [b(26), 60, 'l']]), K(t, [[b(19), 0], [b(26), -20, 'l']]), K(t, [[b(19), D + 200], [b(26), D - 150, 'l'], [b(28), D - 150]])];
  look(p, [p[0] * .3, p[1], 0]);
  const logoT = b(28);
  const focusPull = K(t, [[logoT - .05, p[2]], [logoT, p[2] - 1400], [logoT + .75, p[2], 'o']]);
  dof(focusPull, t < logoT ? .00003 : .00006, t < logoT ? .012 : .02);
  // the column of neon lines rolls up, old lines recede into depth (and blur)
  W3.col.position.y = K(t, [[b(20.5) - .14, 0], [b(20.5) + .12, 110], [b(22) - .14, 110], [b(22) + .12, 325], [b(23.5) - .14, 325], [b(23.5) + .12, 570], [b(25) - .14, 570], [b(25) + .12, 680]]);
  const starts = [b(19), b(20.5), b(22), b(23.5), b(25)];
  W3.lines.forEach((m, i) => {
    const on = seg(t, starts[i] - .04, .32, 'expo');
    const next = i < 3 ? starts[i + 1] : (i === 3 ? b(26) + 5 : 99), next2 = i < 3 ? starts[i + 2] || 99 : 99;
    const back = seg(t, next - .14, .3), gone = seg(t, next2 - .14, .26);
    const flick = (t > starts[i] + .38 && t < starts[i] + .5) ? (Math.sin(t * 160) > 0 ? .45 : 1) : 1;
    m.position.z = -380 * back - 300 * gone; m.scale.setScalar(Math.max(.001, .7 + .3 * on));
    const brk = seg(t, b(27.3), .34, 'i');
    if (i >= 3) { m.scale.multiplyScalar(1 + .25 * brk); }
    setOp(m, on * flick * (1 - .62 * back) * (1 - gone) * (i >= 3 ? 1 - brk : 1));
    m.visible = t < logoT + .01 && m.material.opacity > .002;
  });
  W3.lines[3].position.z = 0; // "Grenzen sind" stays in front together with "im Kopf."
  { const a = b(23.5) + .02, gi = t > a && t < a + .2; const k = Math.floor((t - a) * 60) % 3;
    W3.g1.visible = W3.g2.visible = gi; W3.g1.position.x = [-16, 12, -7][k]; W3.g2.position.x = [16, -12, 7][k]; }
  // bars slam down, then break open
  W3.bars.forEach((m, i) => {
    const h = m.userData.home, d = i - 7;
    const dn = seg(t, b(26) - .2 + Math.abs(d) * .012, .2, 'i'), br = seg(t, b(27.3), .36, 'i');
    m.position.set(h[0] + d * 160 * br, h[1] + 5600 * (1 - dn) + 600 * br, h[2] + 300 * br);
    m.rotation.set(0, 0, -d * .05 * br); m.visible = dn > 0 && br < 1;
  });
  // logo into focus, then the claim letters
  const lo = seg(t, logoT - .04, .5, 'o'), fade = seg(t, DUR - .5, .4, 'i');
  setOp(W3.logo, lo * (1 - fade)); W3.logo.scale.setScalar(1.06 - .06 * lo);
  W3.mc.forEach((m, i) => { const u = seg(t, b(29) + i * .04, .3, 'o'); m.position.y = -250 - 14 * (1 - u); setOp(m, u * (1 - fade)); });
  setOp(W3.hd, seg(t, b(30), .4) * (1 - fade));
}

function renderAt(t) {
  t = Math.max(0, Math.min(DUR - 1e-4, t));
  document.getElementById('oval').style.opacity = 0;
  if (t < b(13)) world1(t); else if (t < b(19)) world2(t); else world3(t);
  composer.render();
}

let ready = false;
window.__hf.buildReady['three'] = build().then(() => { ready = true; renderAt(0); });
window.addEventListener('hf-seek', e => { if (ready) renderAt(e.detail.time); else e.detail.waitUntil && e.detail.waitUntil(window.__hf.buildReady['three'].then(() => renderAt(e.detail.time))); });
</script>
