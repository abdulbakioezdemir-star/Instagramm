      const tl = gsap.timeline({ paused: true });

      hide("#a", 2.95);

      /* ======== 2  the spark ======== */
      tl.fromTo("#spark", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 3.35);
      tl.to("#spark", { keyframes: [{ scale: 1.25, duration: .9, ease: "sine.inOut" }, { scale: 1, duration: .9, ease: "sine.inOut" }, { scale: 1.3, duration: .9, ease: "sine.inOut" }, { scale: 1.05, duration: .8, ease: "sine.inOut" }] }, 4.6);
      show("#b1", 3.7);
      hide("#b", 6.15);

      /* ======== 3 ======== */
      show("#c1", 6.55); show("#c2", 7.35);
      tl.fromTo("#c3", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.6, ease: "power2.inOut" }, 7.6);
      hide("#c", 9.15);
      // anticipation: the spark breathes faster, then draws in
      tl.to("#spark", { scale: 1.8, duration: 0.45, ease: "power2.out" }, 8.4);
      tl.to("#spark", { scale: 0.6, duration: 0.5, ease: "power3.in" }, IGN - 0.5);

      /* ======== IGNITION ======== */
      tl.to("#spark", { scale: 9, opacity: 0, duration: 0.9, ease: "expo.out" }, IGN);
