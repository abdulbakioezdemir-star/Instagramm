      tl.fromTo(["#barT", "#barB"], { height: 150 }, { height: 0, duration: 1.2, ease: "expo.inOut" }, 0.05);
      slam("#p1a", 0.05, 1.5, 0.55);
      punch(0.05, .05); flash(0.05, .5);
      punch(1.35, .02); punch(1.95, .02); punch(2.45, .025);
      rise("#p1b", 1.95, 0.6);
      punch(3.05, .03);
      exitZ("#p1", 4.1);

      /* ======== 1  the spark ======== */
      tl.fromTo("#spark", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1.4, duration: 0.35, ease: "expo.out" }, 4.33);
      tl.to("#spark", { scale: 1, duration: 0.8, ease: "power2.out" }, 4.7);
      slam("#p2", 4.35, 1.3); punch(4.35, .04); flash(4.35, .35);
      punch(5.65, .02); punch(6.25, .02);
      exitZ("#p2", 7.0);

      /* ======== 2  what holds it down ======== */
      slam("#p3a", 7.25, 1.4, .35); punch(7.25, .04); shake(7.25, 8);
      slam("#p3b", 7.85, 1.4, .35); punch(7.85, .03); shake(7.85, 6);
      slam("#p3c", 8.45, 1.4, .35); punch(8.45, .04); shake(8.45, 10);
      tl.to("#spark", { keyframes: [{ opacity: .35, scale: .7, duration: .08 }, { opacity: 1, scale: 1, duration: .1 }, { opacity: .25, scale: .6, duration: .1 }, { opacity: .9, scale: .9, duration: .12 },
        { opacity: .4, scale: .7, duration: .1 }, { opacity: 1, scale: 1, duration: .2 }] }, 7.3);
      exitZ("#p3", 9.95, .25);

      /* ======== 3  but a spark is enough ======== */
      slam("#p4a", 10.25, 1.3); punch(10.25, .035);
      slam("#p4b", 11.95, 1.5, .5); punch(11.95, .05); flash(11.95, .45);
      tl.to("#spark", { scale: 1.6, duration: 1.0, ease: "power2.inOut" }, 10.3);

      /* ======== implosion: everything is pulled into the spark ======== */
      tl.to("#p4", { scale: 0.05, y: 280, opacity: 0, filter: "blur(10px)", duration: 0.55, ease: "power4.in" }, 12.35);
      tl.to("#spark", { scale: 3.2, duration: 0.55, ease: "power2.in" }, 12.35);
      tl.to("#spark", { scale: 0.5, duration: 0.25, ease: "power4.in" }, IGN - 0.25);
      tl.fromTo(["#barT", "#barB"], { height: 0 }, { height: 120, duration: 0.6, ease: "power3.in", immediateRender: false }, 12.5);

      /* ======== IGNITION ======== */
      tl.to(["#barT", "#barB"], { height: 0, duration: 0.5, ease: "expo.out" }, IGN);
      tl.fromTo("#white", { opacity: .85 }, { opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, IGN);
      tl.to("#spark", { scale: 10, opacity: 0, duration: 0.9, ease: "expo.out" }, IGN);
      tl.fromTo("#bloom", { opacity: 0, scale: 0.15 }, { opacity: 1, scale: 1.3, duration: 0.45, ease: "expo.out" }, IGN);
      tl.to("#bloom", { opacity: 0, scale: 1.9, duration: 1.4, ease: "power2.out" }, IGN + 0.45);
      tl.fromTo("#streak", { opacity: 1, scaleX: 0.1, scaleY: 1.6 }, { opacity: 0, scaleX: 1.2, scaleY: 0.4, duration: 1.2, ease: "expo.out", immediateRender: false }, IGN);
      shake(IGN, 22); punch(IGN, .08);
      tl.fromTo(".ember", { opacity: 0 }, { opacity: (i, el) => +el.dataset.o, duration: 1.0, ease: "power2.out" }, IGN + 0.05);
      tl.fromTo("#scrim", { opacity: 0 }, { opacity: .75, duration: 1.0, ease: "power2.out" }, IGN + 0.3);
      tl.to("#scrim", { opacity: 1, duration: 0.8, ease: "power2.inOut" }, 18.6);

      /* ======== 4  Potenzial entfachen ======== */
      slam("#d1", IGN + 0.02, 1.6, 0.7);
      tl.fromTo("#d1", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 2.6, ease: "power1.inOut" }, IGN);
      slam("#d2", 14.6, 1.25, 0.5); punch(14.6, .025);
      exitZ(["#d1", "#d2"], 15.85, .28);

      /* ======== 5  stabs ======== */
      slam("#e1", 16.15, 1.4, .35); punch(16.15, .045); shake(16.15, 9); flash(16.15, .35);
      slam("#e2", 16.75, 1.4, .35); punch(16.75, .03);
      slam("#e3", 17.65, 1.5, .4); punch(17.65, .05); shake(17.65, 12); flash(17.65, .4);
      tl.fromTo("#e3", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.0, ease: "power2.inOut" }, 17.7);
      exitZ("#e", 18.85, .28);

      /* ======== 6  logo ======== */
      tl.fromTo("#logo", { opacity: 0, scale: 1.45, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 19.1);
      tl.fromTo("#ring", { opacity: .9, scale: 0.4 }, { opacity: 0, scale: 1.9, duration: 1.1, ease: "expo.out", immediateRender: false }, 19.15);
      punch(19.15, .06); shake(19.15, 14); flash(19.15, .5);
      tl.fromTo("#shine", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.0, ease: "power2.inOut" }, 19.5);
      tl.fromTo("#lline", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, 19.7);
      rise("#role", 19.9, .6);
      rise("#cl1", 20.5, .55);
      slam("#cl2", 22.05, 1.3, .45); punch(22.05, .03); flash(22.05, .3);
      tl.fromTo("#cl2", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 22.1);
      rise("#handle", 22.6, .6);
      tl.to(["#cam", "#silk"], { opacity: 0, duration: 0.9, ease: "power2.in" }, 23.55);

      window.__timelines["main"] = tl;
    </script>
  </body>
