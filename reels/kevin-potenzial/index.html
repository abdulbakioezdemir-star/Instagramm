      tl.to("#spark", { keyframes: [{ opacity: .4, duration: .12 }, { opacity: 1, duration: .14 }, { opacity: .3, duration: .1 }, { opacity: .9, duration: .16 }, { opacity: .5, duration: .12 }, { opacity: 1, duration: .3 }] }, 7.2);
      exitZ("#p3", 9.8);

      /* ======== Doch ein Funke genügt. ======== */
      slam("#p4a", 10.14);
      slam("#p4b", 11.08, 1.5, .55);
      tl.fromTo("#p4b", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 11.1);
      tl.to("#spark", { scale: 1.6, duration: 1.4, ease: "sine.inOut" }, 10.3);

      /* everything is drawn into the spark */
      tl.to("#p4", { scale: 0.08, y: 250, opacity: 0, filter: "blur(12px)", duration: 0.6, ease: "power4.in" }, 12.4);
      tl.to("#spark", { scale: 3.4, duration: 0.6, ease: "power3.in" }, 12.4);

      /* ======== IGNITION: the floodlights come on ======== */
      tl.fromTo("#white", { opacity: .55 }, { opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, IGN);
      tl.to("#spark", { scale: 10, opacity: 0, duration: 0.8, ease: "expo.out" }, IGN);
      tl.fromTo("#bloom", { opacity: 0, scale: 0.15 }, { opacity: .9, scale: 1.3, duration: 0.45, ease: "expo.out" }, IGN);
      tl.to("#bloom", { opacity: 0, scale: 1.9, duration: 1.3, ease: "power2.out" }, IGN + 0.45);
      tl.fromTo(".ember", { opacity: 0 }, { opacity: (i, el) => +el.dataset.o, duration: 1.0, ease: "power2.out" }, IGN + 0.1);

      /* ======== Potenzial entfachen ======== */
      slam("#d1", IGN + 0.02, 1.8, 0.75);
      tl.fromTo("#d1", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 2.4, ease: "power1.inOut" }, IGN);
      slam("#d2", 13.87, 1.3, .5);
      exitZ(["#d1", "#d2"], 15.45);

      /* ======== Klarheit. Fokus. Stärke. — the tactic board draws itself on the pitch ======== */
      slam("#e1", 15.95, 1.45, .4);
      tl.fromTo(["#o1", "#o2", "#o3"], { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.08 }, 15.95);
      slam("#e2", 16.9, 1.45, .4);
      draw("#a1", 16.9, 0.5); draw("#a2", 17.1, 0.5);
      slam("#e3", 17.8, 1.5, .45);
      draw("#a3", 17.8, 0.7);
      tl.fromTo("#e3", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.0, ease: "power2.inOut" }, 17.8);
      exitZ("#e", 18.75);
      tl.to("#tac", { opacity: 0, duration: 0.5, ease: "power2.in" }, 18.75);

      /* ======== Kevin Nsimba. Dein Mental Coach. ======== */
      tl.fromTo("#logo", { opacity: 0, scale: 1.45, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.75, ease: "expo.out" }, 19.15);
      tl.fromTo("#ring", { opacity: .7, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 1.2, ease: "expo.out", immediateRender: false }, 19.2);
      tl.fromTo("#shine", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 19.6);
      tl.fromTo("#lline", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, 20.3);
      slam("#role", 20.67, 1.3, .5);
      rise("#cl1", 21.7); rise("#cl2", 22.15);
      tl.fromTo("#cl2", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 22.15);
      rise("#handle", 22.7);
      tl.to(["#cam", "#bgv"], { opacity: 0, duration: 0.9, ease: "power2.in" }, 23.55);

      window.__timelines["main"] = tl;
    </script>
  </body>
