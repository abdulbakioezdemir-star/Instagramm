      tl.fromTo("#em27", { y: 118, x: 58 }, { y: -80, x: 64, duration: 0.81, ease: "none" }, 0);
      tl.fromTo("#em27", { y: 2000, x: 0 }, { y: -80, x: 64, duration: 8.45, ease: "none", repeat: 2, immediateRender: false }, 0.81);
      tl.fromTo("#em28", { y: 1992, x: 0 }, { y: -80, x: 30, duration: 12.71, ease: "none" }, 0);
      tl.fromTo("#em28", { y: 2000, x: 0 }, { y: -80, x: 30, duration: 12.76, ease: "none", repeat: 2, immediateRender: false }, 12.71);
      tl.fromTo("#em29", { y: 1888, x: 1 }, { y: -80, x: 12, duration: 9.94, ease: "none" }, 0);
      tl.fromTo("#em29", { y: 2000, x: 0 }, { y: -80, x: 12, duration: 10.50, ease: "none", repeat: 2, immediateRender: false }, 9.94);

      /* ======== 0  the sentence is there, dim; words light up on the hits ======== */
      tl.fromTo("#p1", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
      lit("#w1", 0.28, .35); lit("#w2", 0.44, .35); lit("#w3", 0.6, .4); lit("#w4", 1.0, .45);
      lit(["#w5", "#w6"], 1.34, .4); lit("#w7", 1.82, 0.5);
      blurOut("#p1", 3.85, 0.5);

      /* ======== 1  "Ein Funke" — the full stop is the spark ======== */
      gsap.set("#spark", { x: 289, y: -114.5, scale: 1.55, opacity: 0 });
      wipe("#p2", 4.25, 0.9);
      tl.fromTo("#p2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.25);
      tl.fromTo("#spark", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.55, duration: 0.5, ease: "back.out(2)" }, 4.75);
      // the text leaves, the spark detaches and glides to the centre of the frame
      blurOut("#p2", 6.55, 0.5);
      tl.to("#spark", { x: 0, y: 0, scale: 1, duration: 1.0, ease: "power3.inOut" }, 6.35);

      /* ======== 2  blur-morph in place ======== */
      blurIn("#p3a", 7.03, 0.4);
      blurOut("#p3a", 7.88, 0.22); blurIn("#p3b", 7.95, 0.38);
      blurOut("#p3b", 8.76, 0.22); blurIn(["#p3t", "#p3u"], 8.83, 0.38);
      tl.to("#spark", { keyframes: [{ opacity: .45, duration: .12 }, { opacity: 1, duration: .14 }, { opacity: .35, duration: .1 }, { opacity: .9, duration: .16 }, { opacity: .5, duration: .12 }, { opacity: 1, duration: .3 }] }, 7.3);

      /* ======== 3  the split ======== */
      tl.fromTo("#hair", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power3.out" }, 9.75);
      tl.to("#p3t", { y: -150, opacity: 0, duration: 0.6, ease: "power3.inOut" }, 9.95);
      tl.to("#p3u", { y: 150, opacity: 0, duration: 0.6, ease: "power3.inOut" }, 9.95);
      tl.to("#hair", { opacity: 0, scaleX: 1.3, duration: 0.5, ease: "power2.in" }, 10.1);
      blurIn("#p4a", 10.04, 0.5);
      wipe("#p4b", 10.86, 0.5);
      tl.fromTo("#p4b", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 11.0);
      tl.to("#spark", { scale: 1.5, duration: 1.6, ease: "sine.inOut" }, 10.4);

      /* ======== the breath before: everything draws into the spark ======== */
      tl.to("#p4", { scale: 0.6, y: 120, opacity: 0, filter: "blur(14px)", duration: 0.7, ease: "power3.in" }, 12.45);
      tl.to("#spark", { scale: 3.2, duration: 0.7, ease: "power3.in" }, 12.45);
      tl.to(".ember", { opacity: 0, duration: 0.1 }, 12.4);

      /* ======== IGNITION ======== */
      tl.fromTo("#white", { opacity: .7 }, { opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, IGN);
      tl.to("#spark", { scale: 10, opacity: 0, duration: 0.9, ease: "expo.out" }, IGN);
      tl.fromTo("#bloom", { opacity: 0, scale: 0.15 }, { opacity: 1, scale: 1.3, duration: 0.45, ease: "expo.out" }, IGN);
      tl.to("#bloom", { opacity: 0, scale: 1.9, duration: 1.4, ease: "power2.out" }, IGN + 0.45);
      tl.fromTo("#streak", { opacity: .9, scaleX: 0.1, scaleY: 1.2 }, { opacity: 0, scaleX: 1.15, scaleY: 0.4, duration: 1.2, ease: "expo.out", immediateRender: false }, IGN);
      tl.fromTo(".ember", { opacity: 0 }, { opacity: (i, el) => +el.dataset.o, duration: 1.0, ease: "power2.out", immediateRender: false }, IGN + 0.05);
      tl.fromTo("#scrim", { opacity: 0 }, { opacity: .75, duration: 1.0, ease: "power2.out" }, IGN + 0.3);
      tl.to("#scrim", { opacity: 1, duration: 0.8, ease: "power2.inOut" }, 18.6);

      /* Potenzial: huge and soft, it settles precisely */
      tl.fromTo("#d1", { opacity: 0, scale: 2.4, filter: "blur(24px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.5, ease: "expo.out" }, IGN + 0.05);
      tl.fromTo("#d1", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 2.6, ease: "power1.inOut" }, IGN);
      tl.fromTo("#d2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 13.8);
      blurOut("#d", 15.65, 0.45);

      /* ======== 5  the list lights up ======== */
      tl.fromTo("#e", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 15.6);
      lit("#e1", 15.95, 0.35);
      dim("#e1", 16.98, 0.4); lit("#e2", 16.98, 0.35);
      dim("#e2", 17.74, 0.4); lit("#e3", 17.74, 0.4);
      tl.fromTo("#e3 .g", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.0, ease: "power2.inOut" }, 17.74);
      blurOut("#e", 18.65, 0.4);

      /* ======== 6  logo: revealed top to bottom, then light passes over it ======== */
      tl.fromTo("#logo", { "--v": "100%", opacity: 1 }, { "--v": "0%", duration: 1.1, ease: "power2.inOut" }, 19.0);
      tl.fromTo("#ring", { opacity: .5, scale: 0.6 }, { opacity: 0, scale: 1.6, duration: 1.6, ease: "expo.out", immediateRender: false }, 19.15);
      tl.fromTo("#shine", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.3, ease: "power2.inOut" }, 19.8);
      tl.fromTo("#lline", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 19.7);
      tl.fromTo("#role", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 20.6);
      tl.fromTo("#claim", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 20.4);
      tl.fromTo("#cl1", { opacity: .0 }, { opacity: .2, duration: 0.4 }, 20.4);
      tl.fromTo("#cl2", { opacity: .0 }, { opacity: .2, duration: 0.4 }, 20.4);
      lit("#cl1", 21.45, 0.6);
      lit("#cl2", 22.05, 0.6);
      tl.fromTo("#cl2", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 22.05);
      tl.fromTo("#handle", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 22.6);
      tl.to(["#cam", "#silk"], { opacity: 0, duration: 0.9, ease: "power2.in" }, 23.55);

      window.__timelines["main"] = tl;
    </script>
