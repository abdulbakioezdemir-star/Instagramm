         then flies through it to the next one. arriving and leaving share one ease,
         so it reads as a single dolly, never as separate effects. */

      let silkS = 1.0;
      const travel = (tLand, d, ease, amt = 0.028) => { const a = silkS; silkS += amt; tl.fromTo("#silk", { scale: a }, { scale: silkS, duration: d, ease, immediateRender: false }, tLand - d); };
      const move = (from, to, tLand, d = 0.8, ease = "power3.inOut") => {
        travel(tLand, d, ease);
        if (from) tl.to(from, { z: PASS, opacity: 0, filter: "blur(14px)", duration: d, ease }, tLand - d);
        if (to) tl.fromTo(to, { z: FAR, opacity: 0, filter: "blur(8px)" }, { z: 0, opacity: 1, filter: "blur(0px)", duration: d, ease }, tLand - d);
      };

      tl.fromTo("#p1", { z: -1400, opacity: 0, filter: "blur(10px)" }, { z: 0, opacity: 1, filter: "blur(0px)", duration: 1.3, ease: "power3.out" }, 0.0);
      rise("#p1b", 1.95);
      glide("#p1", 1.3, 2.2);

      /* spark wakes up, lines fly past it */
      tl.fromTo("#spark", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, 3.6);
      move("#p1", "#p2", 4.35);
      glide("#p2", 4.35, 2.1);
      move("#p2", "#p3a", 7.25, 0.65);
      move("#p3a", "#p3b", 7.85, 0.55);
      move("#p3b", "#p3c", 8.45, 0.55);
      tl.to("#spark", { keyframes: [{ opacity: .45, duration: .12 }, { opacity: 1, duration: .14 }, { opacity: .35, duration: .1 }, { opacity: .9, duration: .16 }, { opacity: .5, duration: .12 }, { opacity: 1, duration: .3 }] }, 7.3);
      glide("#p3c", 8.45, 1.0);
      move("#p3c", "#p4", 10.25, 0.75);
      rise("#p4b", 11.95, 0.6);
      tl.fromTo("#p4b", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 11.95);
      tl.to("#spark", { scale: 1.5, duration: 1.6, ease: "sine.inOut" }, 10.4);

      /* ======== the dive: the camera rushes into the spark ======== */
      tl.to("#p4", { z: 900, opacity: 0, filter: "blur(18px)", duration: 0.7, ease: "power3.in" }, 12.45);
      tl.to("#spark", { scale: 4.5, duration: 0.7, ease: "power3.in" }, 12.45);
      travel(13.15, 0.7, "power3.in", 0.08);
      { const a = silkS; silkS -= 0.06; tl.fromTo("#silk", { scale: a }, { scale: silkS, duration: 1.4, ease: "expo.out", immediateRender: false }, IGN); }
      tl.to(".ember", { opacity: 0, duration: 0.1 }, 12.4);
      tl.fromTo(["#barT", "#barB"], { height: 0 }, { height: 110, duration: 0.7, ease: "power3.in" }, 12.45);

      /* ======== IGNITION ======== */
      tl.to(["#barT", "#barB"], { height: 0, duration: 0.9, ease: "expo.out" }, IGN);
      tl.fromTo("#white", { opacity: .9 }, { opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, IGN);
      tl.to("#spark", { scale: 10, opacity: 0, duration: 0.9, ease: "expo.out" }, IGN);
      tl.fromTo("#bloom", { opacity: 0, scale: 0.15 }, { opacity: 1, scale: 1.3, duration: 0.45, ease: "expo.out" }, IGN);
      tl.to("#bloom", { opacity: 0, scale: 1.9, duration: 1.4, ease: "power2.out" }, IGN + 0.45);
      tl.fromTo("#streak", { opacity: 1, scaleX: 0.1, scaleY: 1.6 }, { opacity: 0, scaleX: 1.2, scaleY: 0.4, duration: 1.2, ease: "expo.out", immediateRender: false }, IGN);
      tl.fromTo(".ember", { opacity: 0 }, { opacity: (i, el) => +el.dataset.o, duration: 1.0, ease: "power2.out", immediateRender: false }, IGN + 0.05);
      tl.fromTo("#scrim", { opacity: 0 }, { opacity: .75, duration: 1.0, ease: "power2.out" }, IGN + 0.3);
      tl.to("#scrim", { opacity: 1, duration: 0.8, ease: "power2.inOut" }, 18.6);

      /* Potenzial comes out of the light: the camera pulls back from it */
      tl.fromTo("#d", { z: 420, opacity: 0, filter: "blur(16px)" }, { z: 0, opacity: 1, filter: "blur(0px)", duration: 1.4, ease: "expo.out" }, IGN);
      tl.fromTo("#d1", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 2.6, ease: "power1.inOut" }, IGN);
      rise("#d2", 14.6);
      glide("#d", 14.55, 0.9);

      /* the stabs: three quick landings */
      move("#d", "#e1", 16.15, 0.7);
      move("#e1", "#e2", 16.75, 0.5);
      move("#e2", "#e3", 17.65, 0.6);
      tl.fromTo("#e3", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.0, ease: "power2.inOut" }, 17.65);
      glide("#e3", 17.65, 0.7);

      /* ======== logo: the last landing ======== */
      move("#e3", null, 19.15, 0.8);
      tl.fromTo(["#logo", "#shine"], { z: FAR, opacity: 0, filter: "blur(8px)" }, { z: 0, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "power3.inOut" }, 18.35);
      tl.fromTo("#ring", { opacity: .7, scale: 0.5 }, { opacity: 0, scale: 1.7, duration: 1.4, ease: "expo.out", immediateRender: false }, 19.15);
      tl.fromTo("#shine", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 19.4);
      tl.fromTo("#lline", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.out" }, 19.6);
      rise("#role", 19.85, .7);
      rise("#cl1", 20.5, .7);
      rise("#cl2", 22.05, .7);
      tl.fromTo("#cl2", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 22.05);
      rise("#handle", 22.6, .7);
      tl.to(["#logo", "#shine"], { z: 60, duration: 4.0, ease: "none" }, 19.95);
      tl.to(["#cam", "#silk"], { opacity: 0, duration: 0.9, ease: "power2.in" }, 23.55);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
