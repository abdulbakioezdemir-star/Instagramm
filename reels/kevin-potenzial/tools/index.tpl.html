<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="ui/gsap.min.js"></script>
    <style>
      @font-face { font-family: Disp; font-weight: 300; src: url(fonts/InterDisplay-Light.otf) format("opentype"); }
      @font-face { font-family: Disp; font-weight: 400; src: url(fonts/InterDisplay-Regular.otf) format("opentype"); }
      @font-face { font-family: Disp; font-weight: 500; src: url(fonts/InterDisplay-Medium.otf) format("opentype"); }
      @font-face { font-family: Disp; font-weight: 600; src: url(fonts/InterDisplay-SemiBold.otf) format("opentype"); }
      @font-face { font-family: Disp; font-weight: 700; src: url(fonts/InterDisplay-Bold.otf) format("opentype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      :root { --gold: #e3c27a; --grey: #8e8e93; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      .full { position: absolute; inset: 0; }
      #silk { width: 1080px; height: 1920px; object-fit: cover; }

      .ember { position: absolute; left: 0; top: 0; border-radius: 50%; background: #ffe2a8; box-shadow: 0 0 10px 2px rgba(227,170,90,.65); }
      #spark { left: 533px; top: 1093px; width: 14px; height: 14px; border-radius: 50%; background: #fff6e2;
               box-shadow: 0 0 18px 6px rgba(255,214,140,.95), 0 0 60px 22px rgba(227,170,90,.55), 0 0 140px 60px rgba(200,130,50,.25); opacity: 0; }
      #bloom { left: 40px; top: 600px; width: 1000px; height: 1000px; border-radius: 50%;
               background: radial-gradient(circle, rgba(255,240,210,.95) 0%, rgba(240,196,120,.65) 18%, rgba(200,130,50,.25) 42%, rgba(0,0,0,0) 68%); opacity: 0; mix-blend-mode: screen; }
      #streak { left: -200px; top: 1096px; width: 1480px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(255,200,120,0), rgba(255,215,150,.85) 35%, #fffaf0 50%, rgba(255,215,150,.85) 65%, rgba(255,200,120,0)); filter: blur(2px); opacity: 0; }
      #flash { background: radial-gradient(70% 50% at 50% 55%, rgba(255,235,200,.55), rgba(255,200,120,.15) 50%, rgba(0,0,0,0) 80%); opacity: 0; mix-blend-mode: screen; }
      #white { background: #fff7e8; opacity: 0; }
      #scrim { background: radial-gradient(64% 36% at 50% 52%, rgba(8,5,2,.82), rgba(8,5,2,.45) 55%, rgba(8,5,2,0) 100%); opacity: 0; }
      #vig { background: radial-gradient(120% 80% at 50% 50%, rgba(0,0,0,0) 50%, rgba(0,0,0,.75) 100%); }
      .bar { position: absolute; left: 0; width: 1080px; height: 0; background: #000; }
      #barT { top: 0; } #barB { bottom: 0; }
      #grain { opacity: .06; mix-blend-mode: overlay; background-size: 256px 256px; }

      .t { position: absolute; left: 0; width: 1080px; text-align: center; font-family: Disp; color: #f5f5f7; letter-spacing: -0.03em; }
      .l { display: block; }
      .grey { color: var(--grey); }
      .g { background: linear-gradient(100deg, #a8782f 0%, #f7e2ad 30%, #d4a454 55%, #fff1cc 72%, #b98a3e 100%); background-size: 220% 100%;
           -webkit-background-clip: text; background-clip: text; color: transparent; }
      #p1 { top: 800px; font-size: 104px; font-weight: 700; line-height: 1.08; }
      .hw { opacity: .2; }
      #p2 { top: 880px; font-size: 136px; font-weight: 700; line-height: 1; opacity: 0; }
      .dotgap { display: inline-block; width: 34px; }
      .big { top: 845px; font-size: 168px; font-weight: 700; line-height: 1.3; opacity: 0; }
      #hair { left: 140px; top: 953px; width: 800px; height: 2px; background: linear-gradient(90deg, rgba(227,194,122,0), #f3d9a0 50%, rgba(227,194,122,0)); opacity: 0; }
      #p4 { top: 800px; font-size: 100px; font-weight: 600; line-height: 1.1; }
      #p4a { opacity: 0; }
      #p4b { font-size: 150px; font-weight: 700; }
      #d { top: 780px; }
      #d1 { font-size: 210px; font-weight: 700; letter-spacing: -0.05em; padding: 0 20px; line-height: 1.05; opacity: 0; }
      #d2 { font-size: 108px; font-weight: 300; letter-spacing: -0.02em; opacity: 0; }
      #e { top: 690px; font-size: 140px; font-weight: 700; line-height: 1.12; opacity: 0; }
      /* soft gradient wipe, driven by --m (100% hidden -> 0% shown) */
      .wipe { --m: 100%; -webkit-mask-image: linear-gradient(90deg, #000 33%, transparent 66%); mask-image: linear-gradient(90deg, #000 33%, transparent 66%);
              -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-position: var(--m) 0; mask-position: var(--m) 0; }
      .wipeV { --v: 100%; -webkit-mask-image: linear-gradient(180deg, #000 33%, transparent 66%); mask-image: linear-gradient(180deg, #000 33%, transparent 66%);
               -webkit-mask-size: 100% 300%; mask-size: 100% 300%; -webkit-mask-position: 0 var(--v); mask-position: 0 var(--v); }
      #logo { left: 185px; top: 560px; width: 710px; }
      #logo img { width: 100%; display: block; }
      #shine { left: 185px; top: 560px; width: 710px; height: 600px; -webkit-mask-image: url(ui/kn-logo.png); mask-image: url(ui/kn-logo.png); -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
               background: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,236,190,1) 50%, rgba(255,255,255,0) 60%); background-size: 300% 100%; background-position: 100% 0; }
      #ring { left: 140px; top: 460px; width: 800px; height: 800px; border-radius: 50%; border: 3px solid rgba(240,205,140,.9); opacity: 0; }
      #lline { left: 365px; top: 1190px; width: 350px; height: 2px; background: var(--gold); transform-origin: 50% 50%; }
      #role { top: 1222px; font-size: 30px; font-weight: 500; letter-spacing: .42em; color: var(--gold); padding-left: .42em; }
      #claim { top: 1320px; font-size: 66px; font-weight: 700; line-height: 1.16; }
      #handle { top: 1535px; font-size: 34px; font-weight: 400; color: #c9c6c0; letter-spacing: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.5" data-fps="30" data-width="1080" data-height="1920">
      <video id="silk" class="clip" src="clips/silk.mp4" muted playsinline data-start="0" data-duration="24.5" data-track-index="0"></video>
      <div id="stage" class="clip" data-start="0" data-duration="24.5" data-track-index="1">
        <div id="cam" class="full">
          {EMBERS}
          <div id="bloom" class="abs"></div>
          <div id="spark" class="abs"></div>
          <div id="streak" class="abs"></div>
          <div id="scrim" class="full"></div>

          <div id="p1" class="t"><span class="l"><span class="hw" id="w1">In</span> <span class="hw" id="w2">dir</span> <span class="hw" id="w3">steckt</span> <span class="hw" id="w4">mehr,</span></span><span class="l"><span class="hw" id="w5">als</span> <span class="hw" id="w6">du</span> <span class="hw" id="w7">denkst.</span></span></div>
          <div id="p2" class="t wipe">Ein Funke<span class="dotgap"></span></div>
          <div id="p3a" class="t grey big">Druck.</div>
          <div id="p3b" class="t grey big">Zweifel.</div>
          <div id="p3t" class="t grey big half" style="clip-path: inset(0 0 50% 0)">Angst.</div>
          <div id="p3u" class="t grey big half" style="clip-path: inset(50% 0 0 0)">Angst.</div>
          <div id="hair" class="abs"></div>
          <div id="p4" class="t"><span class="l" id="p4a">Doch ein Funke</span><span class="l g wipe" id="p4b">genügt.</span></div>
          <div id="d" class="t"><span class="l g" id="d1">Potenzial</span><span class="l" id="d2">entfachen.</span></div>
          <div id="e" class="t"><span class="l hw" id="e1">Klarheit.</span><span class="l hw" id="e2">Fokus.</span><span class="l hw" id="e3"><span class="g">Stärke.</span></span></div>

          <div id="ring" class="abs"></div>
          <div id="logo" class="abs wipeV"><img src="ui/kn-logo.png" alt="Kevin Nsimba" /></div>
          <div id="shine" class="abs"></div>
          <div id="lline" class="abs"></div>
          <div id="role" class="t">MENTAL COACH</div>
          <div id="claim" class="t"><span class="l" id="cl1">Train the mind.</span><span class="l g" id="cl2">Change the game.</span></div>
          <div id="handle" class="t">@kevnsimba</div>
        </div>
        <div id="flash" class="full"></div>
        <div id="white" class="full"></div>
        <div id="vig" class="full"></div>
        <div id="bars" class="full"><div id="barT" class="bar"></div><div id="barB" class="bar"></div></div>
        <div id="grain" class="full" style="background-image:url(ui/grain.png)"></div>
      </div>
      <audio id="music" class="clip" src="music/onni-fearless.mp3" data-start="0" data-duration="24.5" data-track-index="20" data-volume="1" data-media-start="5.85" data-fade-out="1.2"></audio>
      <audio id="riser" class="clip" src="sfx/riser.wav" data-start="12.12" data-duration="1.0" data-track-index="21" data-volume="0.35"></audio>
      <audio id="boom" class="clip" src="sfx/boom.wav" data-start="13.15" data-duration="2.2" data-track-index="22" data-volume="0.9"></audio>
      <audio id="boom2" class="clip" src="sfx/boom.wav" data-start="19.15" data-duration="2.2" data-track-index="23" data-volume="0.55"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const IGN = 13.15;          // the big entry of the music

      /* ---------- one quiet vocabulary ----------
         light-up (words brighten in place), soft wipes, blur-morphs, one split, one reveal. no shakes, no pumps. */
      const lit = (sel, t, d = 0.5) => tl.fromTo(sel, { opacity: .2 }, { opacity: 1, duration: d, ease: "power2.out" }, t);
      const dim = (sel, t, d = 0.5) => tl.to(sel, { opacity: .2, duration: d, ease: "power2.inOut" }, t);
      const blurOut = (sel, t, d = 0.45) => tl.to(sel, { opacity: 0, filter: "blur(18px)", scale: 1.04, duration: d, ease: "power2.in" }, t);
      const blurIn = (sel, t, d = 0.6) => tl.fromTo(sel, { opacity: 0, filter: "blur(18px)", scale: .97 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: d, ease: "power2.out" }, t);
      const wipe = (sel, t, d = 0.9) => tl.fromTo(sel, { "--m": "100%" }, { "--m": "0%", duration: d, ease: "power2.inOut" }, t);

      tl.fromTo("#silk", { scale: 1.0 }, { scale: 1.07, duration: 24.5, ease: "none" }, 0);
      {EMBER_JS}

      /* ======== 0  the sentence is there, dim; words light up on the hits ======== */
      tl.fromTo("#p1", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
      lit("#w1", 0.05); lit("#w2", 0.6); lit("#w3", 1.35); lit("#w4", 1.95, 0.6);
      lit(["#w5", "#w6"], 2.45); lit("#w7", 3.05, 0.6);
      blurOut("#p1", 3.85, 0.5);

      /* ======== 1  "Ein Funke" — the full stop is the spark ======== */
      gsap.set("#spark", { x: 289, y: -114.5, scale: 1.55, opacity: 0 });
      wipe("#p2", 4.2, 1.0);
      tl.fromTo("#p2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.2);
      tl.fromTo("#spark", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.55, duration: 0.5, ease: "back.out(2)" }, 4.75);
      // the text leaves, the spark detaches and glides to the centre of the frame
      blurOut("#p2", 6.55, 0.5);
      tl.to("#spark", { x: 0, y: 0, scale: 1, duration: 1.0, ease: "power3.inOut" }, 6.35);

      /* ======== 2  blur-morph in place ======== */
      blurIn("#p3a", 7.15, 0.45);
      blurOut("#p3a", 7.68, 0.25); blurIn("#p3b", 7.75, 0.4);
      blurOut("#p3b", 8.28, 0.25); blurIn(["#p3t", "#p3u"], 8.35, 0.4);
      tl.to("#spark", { keyframes: [{ opacity: .45, duration: .12 }, { opacity: 1, duration: .14 }, { opacity: .35, duration: .1 }, { opacity: .9, duration: .16 }, { opacity: .5, duration: .12 }, { opacity: 1, duration: .3 }] }, 7.3);

      /* ======== 3  the split ======== */
      tl.fromTo("#hair", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power3.out" }, 9.75);
      tl.to("#p3t", { y: -150, opacity: 0, duration: 0.6, ease: "power3.inOut" }, 9.95);
      tl.to("#p3u", { y: 150, opacity: 0, duration: 0.6, ease: "power3.inOut" }, 9.95);
      tl.to("#hair", { opacity: 0, scaleX: 1.3, duration: 0.5, ease: "power2.in" }, 10.1);
      blurIn("#p4a", 10.2, 0.6);
      wipe("#p4b", 11.85, 0.8);
      tl.fromTo("#p4b", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 11.95);
      tl.to("#spark", { scale: 1.5, duration: 1.6, ease: "sine.inOut" }, 10.4);

      /* ======== the breath before: everything draws into the spark ======== */
      tl.to("#p4", { scale: 0.6, y: 120, opacity: 0, filter: "blur(14px)", duration: 0.7, ease: "power3.in" }, 12.45);
      tl.to("#spark", { scale: 3.2, duration: 0.7, ease: "power3.in" }, 12.45);
      tl.to(".ember", { opacity: 0, duration: 0.1 }, 12.4);

      /* ======== IGNITION ======== */
      tl.fromTo("#white", { opacity: .7 }, { opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, IGN);
      tl.to("#spark", { scale: 10, opacity: 0, duration: 0.9, ease: "expo.out" }, IGN);
      tl.fromTo("#bloom", { opacity: 0, scale: 0.15 }, { opacity: 1, scale: 1.3, duration: 0.45, ease: "expo.out" }, IGN);
      tl.to("#bloom", { opacity: 0, scale: 1.9, duration: 1.4, ease: "power2.out" }, IGN + 0.45);
      tl.fromTo("#streak", { opacity: .9, scaleX: 0.1, scaleY: 1.2 }, { opacity: 0, scaleX: 1.15, scaleY: 0.4, duration: 1.2, ease: "expo.out", immediateRender: false }, IGN);
      tl.fromTo(".ember", { opacity: 0 }, { opacity: (i, el) => +el.dataset.o, duration: 1.0, ease: "power2.out", immediateRender: false }, IGN + 0.05);
      tl.fromTo("#scrim", { opacity: 0 }, { opacity: .75, duration: 1.0, ease: "power2.out" }, IGN + 0.3);
      tl.to("#scrim", { opacity: 1, duration: 0.8, ease: "power2.inOut" }, 18.6);

      /* Potenzial: huge and soft, it settles precisely */
      tl.fromTo("#d1", { opacity: 0, scale: 2.4, filter: "blur(24px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.5, ease: "expo.out" }, IGN + 0.05);
      tl.fromTo("#d1", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 2.6, ease: "power1.inOut" }, IGN);
      tl.fromTo("#d2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 14.6);
      blurOut("#d", 15.65, 0.45);

      /* ======== 5  the list lights up ======== */
      tl.fromTo("#e", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 15.95);
      lit("#e1", 16.15, 0.35);
      dim("#e1", 16.75, 0.4); lit("#e2", 16.75, 0.35);
      dim("#e2", 17.65, 0.4); lit("#e3", 17.65, 0.4);
      tl.fromTo("#e3 .g", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.0, ease: "power2.inOut" }, 17.65);
      blurOut("#e", 18.6, 0.45);

      /* ======== 6  logo: revealed top to bottom, then light passes over it ======== */
      tl.fromTo("#logo", { "--v": "100%", opacity: 1 }, { "--v": "0%", duration: 1.1, ease: "power2.inOut" }, 19.0);
      tl.fromTo("#ring", { opacity: .5, scale: 0.6 }, { opacity: 0, scale: 1.6, duration: 1.6, ease: "expo.out", immediateRender: false }, 19.15);
      tl.fromTo("#shine", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.3, ease: "power2.inOut" }, 19.8);
      tl.fromTo("#lline", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 19.7);
      tl.fromTo("#role", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 20.0);
      tl.fromTo("#claim", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 20.4);
      tl.fromTo("#cl1", { opacity: .0 }, { opacity: .2, duration: 0.4 }, 20.4);
      tl.fromTo("#cl2", { opacity: .0 }, { opacity: .2, duration: 0.4 }, 20.4);
      lit("#cl1", 20.75, 0.6);
      lit("#cl2", 22.05, 0.6);
      tl.fromTo("#cl2", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 22.05);
      tl.fromTo("#handle", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 22.6);
      tl.to(["#cam", "#silk"], { opacity: 0, duration: 0.9, ease: "power2.in" }, 23.55);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
