<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="ui/gsap.min.js"></script>
    <style>
      @font-face { font-family: Disp; font-weight: 300; src: url(fonts/InterDisplay-Light.otf) format("opentype"); }
      @font-face { font-family: Disp; font-weight: 400; src: url(fonts/InterDisplay-Regular.otf) format("opentype"); }
      @font-face { font-family: Disp; font-weight: 500; src: url(fonts/InterDisplay-Medium.otf) format("opentype"); }
      @font-face { font-family: Disp; font-weight: 600; src: url(fonts/InterDisplay-SemiBold.otf) format("opentype"); }
      @font-face { font-family: Disp; font-weight: 700; src: url(fonts/InterDisplay-Bold.otf) format("opentype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      :root { --gold: #e3c27a; --grey: #8e8e93; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      .full { position: absolute; inset: 0; }
      #silk { width: 1080px; height: 1920px; object-fit: cover; }

      .ember { position: absolute; left: 0; top: 0; border-radius: 50%; background: #ffe2a8; box-shadow: 0 0 10px 2px rgba(227,170,90,.65); }
      #spark { left: 533px; top: 1093px; width: 14px; height: 14px; border-radius: 50%; background: #fff6e2;
               box-shadow: 0 0 18px 6px rgba(255,214,140,.95), 0 0 60px 22px rgba(227,170,90,.55), 0 0 140px 60px rgba(200,130,50,.25); opacity: 0; }
      #bloom { left: 40px; top: 600px; width: 1000px; height: 1000px; border-radius: 50%;
               background: radial-gradient(circle, rgba(255,240,210,.95) 0%, rgba(240,196,120,.65) 18%, rgba(200,130,50,.25) 42%, rgba(0,0,0,0) 68%); opacity: 0; mix-blend-mode: screen; }
      #streak { left: -200px; top: 1096px; width: 1480px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(255,200,120,0), rgba(255,215,150,.85) 35%, #fffaf0 50%, rgba(255,215,150,.85) 65%, rgba(255,200,120,0)); filter: blur(2px); opacity: 0; }
      #flash { background: radial-gradient(70% 50% at 50% 55%, rgba(255,235,200,.55), rgba(255,200,120,.15) 50%, rgba(0,0,0,0) 80%); opacity: 0; mix-blend-mode: screen; }
      #white { background: #fff7e8; opacity: 0; }
      #scrim { background: radial-gradient(64% 36% at 50% 52%, rgba(8,5,2,.82), rgba(8,5,2,.45) 55%, rgba(8,5,2,0) 100%); opacity: 0; }
      #vig { background: radial-gradient(120% 80% at 50% 50%, rgba(0,0,0,0) 50%, rgba(0,0,0,.75) 100%); }
      .bar { position: absolute; left: 0; width: 1080px; height: 0; background: #000; }
      #barT { top: 0; } #barB { bottom: 0; }
      #grain { opacity: .06; mix-blend-mode: overlay; background-size: 256px 256px; }

      .t { position: absolute; left: 0; width: 1080px; text-align: center; font-family: Disp; color: #f5f5f7; letter-spacing: -0.03em; }
      .l { display: block; }
      .grey { color: var(--grey); }
      .g { background: linear-gradient(100deg, #a8782f 0%, #f7e2ad 30%, #d4a454 55%, #fff1cc 72%, #b98a3e 100%); background-size: 220% 100%;
           -webkit-background-clip: text; background-clip: text; color: transparent; }
      #cam { perspective: 1000px; perspective-origin: 50% 50%; }
      .st { will-change: transform, opacity, filter; opacity: 0; }
      #p1b, #p4b, #d2 { opacity: 0; }
      #p1 { top: 820px; font-size: 100px; font-weight: 700; line-height: 1.08; }
      #p2 { top: 880px; font-size: 136px; font-weight: 700; }
      .big { top: 870px; font-size: 168px; font-weight: 700; }
      #p4 { top: 800px; font-size: 100px; font-weight: 600; line-height: 1.1; }
      #p4b { font-size: 150px; font-weight: 700; }
      #d { top: 780px; }
      #d1 { font-size: 210px; font-weight: 700; letter-spacing: -0.05em; padding: 0 20px; line-height: 1.05; }
      #d2 { font-size: 108px; font-weight: 300; letter-spacing: -0.02em; }
      #logo { left: 185px; top: 560px; width: 710px; }
      #logo img { width: 100%; display: block; }
      #shine { left: 185px; top: 560px; width: 710px; height: 600px; -webkit-mask-image: url(ui/kn-logo.png); mask-image: url(ui/kn-logo.png); -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
               background: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,236,190,1) 50%, rgba(255,255,255,0) 60%); background-size: 300% 100%; background-position: 100% 0; }
      #ring { left: 140px; top: 460px; width: 800px; height: 800px; border-radius: 50%; border: 3px solid rgba(240,205,140,.9); opacity: 0; }
      #lline { left: 365px; top: 1190px; width: 350px; height: 2px; background: var(--gold); transform-origin: 50% 50%; }
      #role { top: 1222px; font-size: 30px; font-weight: 500; letter-spacing: .42em; color: var(--gold); padding-left: .42em; }
      #claim { top: 1320px; font-size: 66px; font-weight: 700; line-height: 1.16; }
      #handle { top: 1535px; font-size: 34px; font-weight: 400; color: #c9c6c0; letter-spacing: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.5" data-fps="30" data-width="1080" data-height="1920">
      <video id="silk" class="clip" src="clips/silk.mp4" muted playsinline data-start="0" data-duration="24.5" data-track-index="0"></video>
      <div id="stage" class="clip" data-start="0" data-duration="24.5" data-track-index="1">
        <div id="cam" class="full">
          {EMBERS}
          <div id="bloom" class="abs"></div>
          <div id="spark" class="abs"></div>
          <div id="streak" class="abs"></div>
          <div id="scrim" class="full"></div>

          <div id="p1" class="t st"><span class="l" id="p1a">In dir steckt mehr,</span><span class="l grey" id="p1b">als du denkst.</span></div>
          <div id="p2" class="t st">Ein Funke.</div>
          <div id="p3a" class="t st grey big">Druck.</div>
          <div id="p3b" class="t st grey big">Zweifel.</div>
          <div id="p3c" class="t st grey big">Angst.</div>
          <div id="p4" class="t st"><span class="l" id="p4a">Doch ein Funke</span><span class="l g" id="p4b">genügt.</span></div>
          <div id="d" class="t st"><span class="l g" id="d1">Potenzial</span><span class="l" id="d2">entfachen.</span></div>
          <div id="e1" class="t st big">Klarheit.</div>
          <div id="e2" class="t st big">Fokus.</div>
          <div id="e3" class="t st big g">Stärke.</div>

          <div id="ring" class="abs"></div>
          <div id="logo" class="abs"><img src="ui/kn-logo.png" alt="Kevin Nsimba" /></div>
          <div id="shine" class="abs"></div>
          <div id="lline" class="abs"></div>
          <div id="role" class="t">MENTAL COACH</div>
          <div id="claim" class="t"><span class="l" id="cl1">Train the mind.</span><span class="l g" id="cl2">Change the game.</span></div>
          <div id="handle" class="t">@kevnsimba</div>
        </div>
        <div id="flash" class="full"></div>
        <div id="white" class="full"></div>
        <div id="vig" class="full"></div>
        <div id="bars" class="full"><div id="barT" class="bar"></div><div id="barB" class="bar"></div></div>
        <div id="grain" class="full" style="background-image:url(ui/grain.png)"></div>
      </div>
      <audio id="music" class="clip" src="music/onni-fearless.mp3" data-start="0" data-duration="24.5" data-track-index="20" data-volume="1" data-media-start="5.85" data-fade-out="1.2"></audio>
      <audio id="riser" class="clip" src="sfx/riser.wav" data-start="12.12" data-duration="1.0" data-track-index="21" data-volume="0.35"></audio>
      <audio id="boom" class="clip" src="sfx/boom.wav" data-start="13.15" data-duration="2.2" data-track-index="22" data-volume="0.9"></audio>
      <audio id="boom2" class="clip" src="sfx/boom.wav" data-start="19.15" data-duration="2.2" data-track-index="23" data-volume="0.55"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const IGN = 13.15;          // the big entry of the music

      /* ---------- one continuous camera move ----------
         every line waits in depth; the camera travels to it and lands on the beat,
         then flies through it to the next one. arriving and leaving share one ease,
         so it reads as a single dolly, never as separate effects. */
      const FAR = -2600, PASS = 760;
      let silkS = 1.0;
      const travel = (tLand, d, ease, amt = 0.028) => { const a = silkS; silkS += amt; tl.fromTo("#silk", { scale: a }, { scale: silkS, duration: d, ease, immediateRender: false }, tLand - d); };
      const move = (from, to, tLand, d = 0.8, ease = "power3.inOut") => {
        travel(tLand, d, ease);
        if (from) tl.to(from, { z: PASS, opacity: 0, filter: "blur(14px)", duration: d, ease }, tLand - d);
        if (to) tl.fromTo(to, { z: FAR, opacity: 0, filter: "blur(8px)" }, { z: 0, opacity: 1, filter: "blur(0px)", duration: d, ease }, tLand - d);
      };
      const rise = (sel, t, d = 0.7) => tl.fromTo(sel, { opacity: 0, y: 34, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d, ease: "power3.out" }, t);
      const glide = (sel, t, d) => tl.to(sel, { z: 90, duration: d, ease: "none" }, t);   // the camera keeps creeping while a line holds

      gsap.set(".st", { z: FAR });
      tl.set("#silk", { scale: 1 }, 0);
      {EMBER_JS}

      /* ======== hook: the first line is already flying in on frame 0 ======== */
      tl.fromTo("#p1", { z: -1400, opacity: 0, filter: "blur(10px)" }, { z: 0, opacity: 1, filter: "blur(0px)", duration: 1.3, ease: "power3.out" }, 0.0);
      rise("#p1b", 1.95);
      glide("#p1", 1.3, 2.2);

      /* spark wakes up, lines fly past it */
      tl.fromTo("#spark", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, 3.6);
      move("#p1", "#p2", 4.35);
      glide("#p2", 4.35, 2.1);
      move("#p2", "#p3a", 7.25, 0.65);
      move("#p3a", "#p3b", 7.85, 0.55);
      move("#p3b", "#p3c", 8.45, 0.55);
      tl.to("#spark", { keyframes: [{ opacity: .45, duration: .12 }, { opacity: 1, duration: .14 }, { opacity: .35, duration: .1 }, { opacity: .9, duration: .16 }, { opacity: .5, duration: .12 }, { opacity: 1, duration: .3 }] }, 7.3);
      glide("#p3c", 8.45, 1.0);
      move("#p3c", "#p4", 10.25, 0.75);
      rise("#p4b", 11.95, 0.6);
      tl.fromTo("#p4b", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 11.95);
      tl.to("#spark", { scale: 1.5, duration: 1.6, ease: "sine.inOut" }, 10.4);

      /* ======== the dive: the camera rushes into the spark ======== */
      tl.to("#p4", { z: 900, opacity: 0, filter: "blur(18px)", duration: 0.7, ease: "power3.in" }, 12.45);
      tl.to("#spark", { scale: 4.5, duration: 0.7, ease: "power3.in" }, 12.45);
      travel(13.15, 0.7, "power3.in", 0.08);
      { const a = silkS; silkS -= 0.06; tl.fromTo("#silk", { scale: a }, { scale: silkS, duration: 1.4, ease: "expo.out", immediateRender: false }, IGN); }
      tl.to(".ember", { opacity: 0, duration: 0.1 }, 12.4);
      tl.fromTo(["#barT", "#barB"], { height: 0 }, { height: 110, duration: 0.7, ease: "power3.in" }, 12.45);

      /* ======== IGNITION ======== */
      tl.to(["#barT", "#barB"], { height: 0, duration: 0.9, ease: "expo.out" }, IGN);
      tl.fromTo("#white", { opacity: .9 }, { opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, IGN);
      tl.to("#spark", { scale: 10, opacity: 0, duration: 0.9, ease: "expo.out" }, IGN);
      tl.fromTo("#bloom", { opacity: 0, scale: 0.15 }, { opacity: 1, scale: 1.3, duration: 0.45, ease: "expo.out" }, IGN);
      tl.to("#bloom", { opacity: 0, scale: 1.9, duration: 1.4, ease: "power2.out" }, IGN + 0.45);
      tl.fromTo("#streak", { opacity: 1, scaleX: 0.1, scaleY: 1.6 }, { opacity: 0, scaleX: 1.2, scaleY: 0.4, duration: 1.2, ease: "expo.out", immediateRender: false }, IGN);
      tl.fromTo(".ember", { opacity: 0 }, { opacity: (i, el) => +el.dataset.o, duration: 1.0, ease: "power2.out", immediateRender: false }, IGN + 0.05);
      tl.fromTo("#scrim", { opacity: 0 }, { opacity: .75, duration: 1.0, ease: "power2.out" }, IGN + 0.3);
      tl.to("#scrim", { opacity: 1, duration: 0.8, ease: "power2.inOut" }, 18.6);

      /* Potenzial comes out of the light: the camera pulls back from it */
      tl.fromTo("#d", { z: 420, opacity: 0, filter: "blur(16px)" }, { z: 0, opacity: 1, filter: "blur(0px)", duration: 1.4, ease: "expo.out" }, IGN);
      tl.fromTo("#d1", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 2.6, ease: "power1.inOut" }, IGN);
      rise("#d2", 14.6);
      glide("#d", 14.55, 0.9);

      /* the stabs: three quick landings */
      move("#d", "#e1", 16.15, 0.7);
      move("#e1", "#e2", 16.75, 0.5);
      move("#e2", "#e3", 17.65, 0.6);
      tl.fromTo("#e3", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.0, ease: "power2.inOut" }, 17.65);
      glide("#e3", 17.65, 0.7);

      /* ======== logo: the last landing ======== */
      move("#e3", null, 19.15, 0.8);
      tl.fromTo(["#logo", "#shine"], { z: FAR, opacity: 0, filter: "blur(8px)" }, { z: 0, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "power3.inOut" }, 18.35);
      tl.fromTo("#ring", { opacity: .7, scale: 0.5 }, { opacity: 0, scale: 1.7, duration: 1.4, ease: "expo.out", immediateRender: false }, 19.15);
      tl.fromTo("#shine", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 19.4);
      tl.fromTo("#lline", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.out" }, 19.6);
      rise("#role", 19.85, .7);
      rise("#cl1", 20.5, .7);
      rise("#cl2", 22.05, .7);
      tl.fromTo("#cl2", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 22.05);
      rise("#handle", 22.6, .7);
      tl.to(["#logo", "#shine"], { z: 60, duration: 4.0, ease: "none" }, 19.95);
      tl.to(["#cam", "#silk"], { opacity: 0, duration: 0.9, ease: "power2.in" }, 23.55);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
