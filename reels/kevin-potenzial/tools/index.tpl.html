<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="ui/gsap.min.js"></script>
    <style>
      @font-face { font-family: Disp; font-weight: 300; src: url(fonts/InterDisplay-Light.otf) format("opentype"); }
      @font-face { font-family: Disp; font-weight: 400; src: url(fonts/InterDisplay-Regular.otf) format("opentype"); }
      @font-face { font-family: Disp; font-weight: 500; src: url(fonts/InterDisplay-Medium.otf) format("opentype"); }
      @font-face { font-family: Disp; font-weight: 600; src: url(fonts/InterDisplay-SemiBold.otf) format("opentype"); }
      @font-face { font-family: Disp; font-weight: 700; src: url(fonts/InterDisplay-Bold.otf) format("opentype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      :root { --gold: #e3c27a; --grey: #9a9aa0; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      .full { position: absolute; inset: 0; }
      #bgv { width: 1080px; height: 1920px; object-fit: cover; }

      .ember { position: absolute; left: 0; top: 0; border-radius: 50%; background: #ffe2a8; box-shadow: 0 0 10px 2px rgba(227,170,90,.65); }
      #spark { left: 533px; top: 1093px; width: 14px; height: 14px; border-radius: 50%; background: #fff6e2;
               box-shadow: 0 0 18px 6px rgba(255,214,140,.95), 0 0 60px 22px rgba(227,170,90,.55), 0 0 140px 60px rgba(200,130,50,.25); opacity: 0; }
      #bloom { left: 40px; top: 600px; width: 1000px; height: 1000px; border-radius: 50%;
               background: radial-gradient(circle, rgba(255,240,210,.95) 0%, rgba(240,196,120,.6) 18%, rgba(200,130,50,.2) 42%, rgba(0,0,0,0) 68%); opacity: 0; mix-blend-mode: screen; }
      #white { background: #fff7e8; opacity: 0; }
      #scrim { background: radial-gradient(70% 30% at 50% 50%, rgba(5,4,2,.78), rgba(5,4,2,.4) 55%, rgba(5,4,2,0) 100%); }
      #vig { background: radial-gradient(120% 80% at 50% 50%, rgba(0,0,0,0) 50%, rgba(0,0,0,.7) 100%); }
      #grain { opacity: .06; mix-blend-mode: overlay; background-size: 256px 256px; }

      .t { position: absolute; left: 0; width: 1080px; text-align: center; font-family: Disp; color: #f5f5f7; letter-spacing: -0.03em; text-shadow: 0 4px 30px rgba(0,0,0,.55); }
      .l { display: block; }
      .grey { color: var(--grey); }
      .g { background: linear-gradient(100deg, #a8782f 0%, #f7e2ad 30%, #d4a454 55%, #fff1cc 72%, #b98a3e 100%); background-size: 220% 100%;
           -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 4px 24px rgba(0,0,0,.5)); }
      #p1 { top: 800px; font-size: 100px; font-weight: 700; line-height: 1.1; }
      #p2 { top: 870px; font-size: 136px; font-weight: 700; }
      #p3 { top: 640px; font-size: 150px; font-weight: 700; line-height: 1.12; }
      #p4 { top: 790px; font-size: 104px; font-weight: 600; line-height: 1.1; }
      #p4b { font-size: 156px; font-weight: 700; padding-bottom: .1em; }
      #d1 { top: 760px; font-size: 210px; font-weight: 700; letter-spacing: -0.05em; padding: 0 20px .08em; }
      #d2 { top: 1010px; font-size: 108px; font-weight: 300; letter-spacing: -0.02em; }
      #e { top: 640px; font-size: 140px; font-weight: 700; line-height: 1.12; }
      #tac { left: 0; top: 0; width: 1080px; height: 1920px; }
      #tac .ln { fill: none; stroke: rgba(255,255,255,.85); stroke-width: 5; stroke-linecap: round; }
      #tac .gd { fill: none; stroke: #f3d9a0; stroke-width: 7; stroke-linecap: round; filter: drop-shadow(0 0 10px rgba(243,200,120,.9)); }
      #tac .pl { fill: none; stroke: rgba(255,255,255,.9); stroke-width: 5; }
      #logo { left: 185px; top: 520px; width: 710px; }
      #logo img { width: 100%; display: block; }
      #shine { left: 185px; top: 520px; width: 710px; height: 600px; -webkit-mask-image: url(ui/kn-logo.png); mask-image: url(ui/kn-logo.png); -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
               background: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,236,190,1) 50%, rgba(255,255,255,0) 60%); background-size: 300% 100%; background-position: 100% 0; }
      #ring { left: 140px; top: 420px; width: 800px; height: 800px; border-radius: 50%; border: 3px solid rgba(240,205,140,.9); opacity: 0; }
      #lline { left: 365px; top: 1150px; width: 350px; height: 2px; background: var(--gold); }
      #role { top: 1180px; font-size: 64px; font-weight: 600; }
      #claim { top: 1310px; font-size: 52px; font-weight: 600; line-height: 1.2; }
      #handle { top: 1480px; font-size: 34px; font-weight: 400; color: #d0cdc6; letter-spacing: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.5" data-fps="30" data-width="1080" data-height="1920">
      <video id="bgv" class="clip" src="clips/stadium.mp4" muted playsinline data-start="0" data-duration="24.5" data-track-index="0"></video>
      <div id="stage" class="clip" data-start="0" data-duration="24.5" data-track-index="1">
        <div id="cam" class="full">
          <svg id="tac" class="abs" viewBox="0 0 1080 1920">
            <circle id="o1" class="pl" cx="250" cy="1690" r="30" />
            <circle id="o2" class="pl" cx="560" cy="1760" r="30" />
            <circle id="o3" class="pl" cx="830" cy="1650" r="30" />
            <path id="a1" class="ln" d="M280,1680 C380,1620 460,1700 530,1750" />
            <path id="a2" class="ln" d="M590,1745 C680,1700 740,1680 800,1660" />
            <path id="a3" class="gd" d="M830,1620 C760,1520 640,1470 545,1430" />
          </svg>
          <div id="scrim" class="full"></div>
          {EMBERS}
          <div id="bloom" class="abs"></div>
          <div id="spark" class="abs"></div>

          <div id="p1" class="t"><span class="l" id="p1a">In dir steckt mehr,</span><span class="l grey" id="p1b">als du denkst.</span></div>
          <div id="p2" class="t">Ein Funke.</div>
          <div id="p3" class="t grey"><span class="l" id="p3a">Druck.</span><span class="l" id="p3b">Zweifel.</span><span class="l" id="p3c">Angst.</span></div>
          <div id="p4" class="t"><span class="l" id="p4a">Doch ein Funke</span><span class="l g" id="p4b">genügt.</span></div>
          <div id="d1" class="t g">Potenzial</div>
          <div id="d2" class="t">entfachen.</div>
          <div id="e" class="t"><span class="l" id="e1">Klarheit.</span><span class="l" id="e2">Fokus.</span><span class="l g" id="e3">Stärke.</span></div>

          <div id="ring" class="abs"></div>
          <div id="logo" class="abs"><img src="ui/kn-logo.png" alt="Kevin Nsimba" /></div>
          <div id="shine" class="abs"></div>
          <div id="lline" class="abs"></div>
          <div id="role" class="t">Dein <span class="g">Mental Coach.</span></div>
          <div id="claim" class="t"><span class="l" id="cl1">Train the mind.</span><span class="l g" id="cl2">Change the game.</span></div>
          <div id="handle" class="t">@kevnsimba</div>
        </div>
        <div id="white" class="full"></div>
        <div id="vig" class="full"></div>
        <div id="grain" class="full" style="background-image:url(ui/grain.png)"></div>
      </div>
      <audio id="music" class="clip" src="music/rudenko-inhale2.mp3" data-start="0" data-duration="24.5" data-track-index="20" data-volume="0.9" data-media-start="59.76" data-fade-in="0.3" data-fade-out="1.5"></audio>
      <audio id="boom" class="clip" src="sfx/boom.wav" data-start="13.12" data-duration="2.2" data-track-index="22" data-volume="0.45"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const IGN = 13.12;       // "Potenzial" is spoken here, the music opens, the floodlights come on

      /* action vocabulary, no shakes, no pumps:
         slam  = the line arrives big and soft and locks into place on the spoken word
         exitZ = the line flies past the camera */
      const slam = (sel, t, from = 1.4, d = 0.5) => tl.fromTo(sel, { opacity: 0, scale: from, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: d, ease: "expo.out" }, t - 0.08);
      const rise = (sel, t, d = 0.55) => tl.fromTo(sel, { opacity: 0, y: 36, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d, ease: "power3.out" }, t - 0.05);
      const exitZ = (sel, t, d = 0.3) => tl.to(sel, { opacity: 0, scale: 1.7, filter: "blur(18px)", duration: d, ease: "power2.in" }, t);
      const draw = (sel, t, d = 0.7) => { gsap.set(sel, { strokeDasharray: 1200, strokeDashoffset: 1200 }); tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t); };

      {EMBER_JS}

      /* ======== voice line 1 ======== */
      slam("#p1a", 0.3, 1.5, 0.6);
      rise("#p1b", 1.34);
      exitZ("#p1", 3.55);

      /* ======== "Ein Funke." ======== */
      slam("#p2", 4.38);
      tl.fromTo("#spark", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, 4.5);
      exitZ("#p2", 6.6);

      /* ======== Druck. Zweifel. Angst. ======== */
      slam("#p3a", 7.13, 1.45, .4);
      slam("#p3b", 7.97, 1.45, .4);
      slam("#p3c", 8.93, 1.45, .4);
      tl.to("#spark", { keyframes: [{ opacity: .4, duration: .12 }, { opacity: 1, duration: .14 }, { opacity: .3, duration: .1 }, { opacity: .9, duration: .16 }, { opacity: .5, duration: .12 }, { opacity: 1, duration: .3 }] }, 7.2);
      exitZ("#p3", 9.8);

      /* ======== Doch ein Funke genügt. ======== */
      slam("#p4a", 10.14);
      slam("#p4b", 11.08, 1.5, .55);
      tl.fromTo("#p4b", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 11.1);
      tl.to("#spark", { scale: 1.6, duration: 1.4, ease: "sine.inOut" }, 10.3);

      /* everything is drawn into the spark */
      tl.to("#p4", { scale: 0.08, y: 250, opacity: 0, filter: "blur(12px)", duration: 0.6, ease: "power4.in" }, 12.4);
      tl.to("#spark", { scale: 3.4, duration: 0.6, ease: "power3.in" }, 12.4);

      /* ======== IGNITION: the floodlights come on ======== */
      tl.fromTo("#white", { opacity: .55 }, { opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, IGN);
      tl.to("#spark", { scale: 10, opacity: 0, duration: 0.8, ease: "expo.out" }, IGN);
      tl.fromTo("#bloom", { opacity: 0, scale: 0.15 }, { opacity: .9, scale: 1.3, duration: 0.45, ease: "expo.out" }, IGN);
      tl.to("#bloom", { opacity: 0, scale: 1.9, duration: 1.3, ease: "power2.out" }, IGN + 0.45);
      tl.fromTo(".ember", { opacity: 0 }, { opacity: (i, el) => +el.dataset.o, duration: 1.0, ease: "power2.out" }, IGN + 0.1);

      /* ======== Potenzial entfachen ======== */
      slam("#d1", IGN + 0.02, 1.8, 0.75);
      tl.fromTo("#d1", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 2.4, ease: "power1.inOut" }, IGN);
      slam("#d2", 13.87, 1.3, .5);
      exitZ(["#d1", "#d2"], 15.45);

      /* ======== Klarheit. Fokus. Stärke. — the tactic board draws itself on the pitch ======== */
      slam("#e1", 15.95, 1.45, .4);
      tl.fromTo(["#o1", "#o2", "#o3"], { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.08 }, 15.95);
      slam("#e2", 16.9, 1.45, .4);
      draw("#a1", 16.9, 0.5); draw("#a2", 17.1, 0.5);
      slam("#e3", 17.8, 1.5, .45);
      draw("#a3", 17.8, 0.7);
      tl.fromTo("#e3", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.0, ease: "power2.inOut" }, 17.8);
      exitZ("#e", 18.75);
      tl.to("#tac", { opacity: 0, duration: 0.5, ease: "power2.in" }, 18.75);

      /* ======== Kevin Nsimba. Dein Mental Coach. ======== */
      tl.fromTo("#logo", { opacity: 0, scale: 1.45, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.75, ease: "expo.out" }, 19.15);
      tl.fromTo("#ring", { opacity: .7, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 1.2, ease: "expo.out", immediateRender: false }, 19.2);
      tl.fromTo("#shine", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 19.6);
      tl.fromTo("#lline", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, 20.3);
      slam("#role", 20.67, 1.3, .5);
      rise("#cl1", 21.7); rise("#cl2", 22.15);
      tl.fromTo("#cl2", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 22.15);
      rise("#handle", 22.7);
      tl.to(["#cam", "#bgv"], { opacity: 0, duration: 0.9, ease: "power2.in" }, 23.55);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
