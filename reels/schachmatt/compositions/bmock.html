  <script>
    const tl = gsap.timeline({ paused: true });
    
    const W = document.querySelector(".bmock-world");
    const ups = document.querySelectorAll(".bmock-world .up");
    const cam = { rx: 70 };
    const stand = () => { gsap.set(W, { rotationX: cam.rx }); ups.forEach((u) => gsap.set(u, { rotationX: -cam.rx, transformOrigin: "50% 100%" })); };

    const tilt = (to, at, dur, ease) => tl.to(cam, { rx: to, duration: dur, ease, onUpdate: stand }, at);
    const blur = (id, px, at, dur) => tl.to("#bmock-" + id + "-img", { filter: `blur(${px}px)`, duration: dur, ease: "power2.inOut" }, at);
    const SQ = 115;
    // the lens aims at a square: that square stays on the stage's perspective origin (540, 1150)
    const aimVals = (f, r) => { const px = 40 + f * SQ + SQ / 2, py = 40 + (7 - r) * SQ + SQ / 2;
      return { x: 540 - 40 - px, y: 1290 - 560 - py, transformOrigin: `${px}px ${py}px` }; };
    const aimSet = (f, r, z) => gsap.set(W, { ...aimVals(f, r), z });
    const aim = (f, r, z, at, dur, ease = "power2.inOut") => tl.to(W, { ...aimVals(f, r), z, duration: dur, ease }, at);
    const move = (id, df, dr, at, dur = 0.34) => {
      tl.to("#bmock-" + id, { x: "+=" + df * SQ, y: "-=" + dr * SQ, duration: dur, ease: "power3.inOut" }, at);
      tl.fromTo("#bmock-" + id + "-tip", { y: 0 }, { y: -34, duration: dur / 2, ease: "power2.out", yoyo: true, repeat: 1 }, at);
    };
    const fall = (id, dir, at) => {
      tl.to("#bmock-" + id + "-tip", { rotation: 86 * dir, transformOrigin: "50% 100%", duration: 0.42, ease: "power2.in" }, at);
      tl.to("#bmock-" + id + "-tip", { rotation: 80 * dir, duration: 0.09, ease: "power1.out", yoyo: true, repeat: 1 }, at + 0.42);
    };

    aimSet(3, 1.7, 720);
    aim(3, 2.0, 830, 0, 2.4, "power1.inOut");
