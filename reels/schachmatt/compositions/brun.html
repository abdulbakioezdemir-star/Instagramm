  <script>
    const tl = gsap.timeline({ paused: true });
    
    const W = document.querySelector(".brun-world");
    const ups = document.querySelectorAll(".brun-world .up");
    const cam = { rx: 66 };
    const stand = () => { gsap.set(W, { rotationX: cam.rx }); ups.forEach((u) => gsap.set(u, { rotationX: -cam.rx, transformOrigin: "50% 100%" })); };

    const tilt = (to, at, dur, ease) => tl.to(cam, { rx: to, duration: dur, ease, onUpdate: stand }, at);
    const blur = (id, px, at, dur) => tl.to("#brun-" + id + "-img", { filter: `blur(${px}px)`, duration: dur, ease: "power2.inOut" }, at);
    const SQ = 115;
    // the lens aims at a square: that square stays on the stage's perspective origin (540, 1150)
    const aimVals = (f, r) => { const px = 40 + f * SQ + SQ / 2, py = 40 + (7 - r) * SQ + SQ / 2;
      return { x: 540 - 40 - px, y: 1290 - 560 - py, transformOrigin: `${px}px ${py}px` }; };
    const aimSet = (f, r, z) => gsap.set(W, { ...aimVals(f, r), z });
    const aim = (f, r, z, at, dur, ease = "power2.inOut") => tl.to(W, { ...aimVals(f, r), z, duration: dur, ease }, at);
    const move = (id, df, dr, at, dur = 0.34) => {
      tl.to("#brun-" + id, { x: "+=" + df * SQ, y: "-=" + dr * SQ, duration: dur, ease: "power3.inOut" }, at);
      tl.fromTo("#brun-" + id + "-tip", { y: 0 }, { y: -34, duration: dur / 2, ease: "power2.out", yoyo: true, repeat: 1 }, at);
    };
    const fall = (id, dir, at) => {
      tl.to("#brun-" + id + "-tip", { rotation: 86 * dir, transformOrigin: "50% 100%", duration: 0.42, ease: "power2.in" }, at);
      tl.to("#brun-" + id + "-tip", { rotation: 80 * dir, duration: 0.09, ease: "power1.out", yoyo: true, repeat: 1 }, at + 0.42);
    };

    // camera rides behind the pawn; it dollies up the board as the pawn advances
    aimSet(3, 0.7, 640);
    const follow = (dx, rank, at, dur = 0.5) => aim(3 + dx, rank + 0.7, 640, at, dur);
    gsap.set("#brun-queen", { opacity: 0 });
    // step 1
    move("pawn", 0, 1, 0.5); follow(0, 1, 0.45);
    // capture the knight
    move("pawn", 1, 1, 1.8); fall("n1", 1, 1.98); tl.to("#brun-n1", { x: "+=160", y: "+=40", opacity: 0, duration: 0.5, ease: "power2.in" }, 2.3); follow(1, 2, 1.75);
    // capture the rook
    move("pawn", -1, 1, 4.3); fall("r1", -1, 4.48); tl.to("#brun-r1", { x: "-=160", y: "+=40", opacity: 0, duration: 0.5, ease: "power2.in" }, 4.8); follow(0, 3, 4.25);
    // capture the bishop, then run
    move("pawn", 1, 1, 7.15); fall("b1", 1, 7.33); tl.to("#brun-b1", { x: "+=160", opacity: 0, duration: 0.5, ease: "power2.in" }, 7.65); follow(1, 4, 7.1);
    move("pawn", 0, 1, 7.62, 0.26); follow(1, 5, 7.58, 0.36);
    move("pawn", 0, 1, 7.95, 0.26); follow(1, 6, 7.92, 0.34);
    move("pawn", 0, 1, 8.28, 0.26); follow(1, 7, 8.25, 0.34);
    // promotion: a shaft of light, the pawn becomes the queen
    tl.fromTo("#brun-shaft", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 8.45);
    tl.to("#brun-shaft", { opacity: 0.35, duration: 1.4, ease: "power2.inOut" }, 8.9);
    tl.fromTo("#brun-flash", { opacity: 0 }, { opacity: 0.85, duration: 0.08, ease: "none" }, 8.62);
    tl.to("#brun-flash", { opacity: 0, duration: 0.6, ease: "power2.out" }, 8.7);
    tl.set("#brun-pawn", { opacity: 0 }, 8.7);
    tl.set("#brun-queen", { opacity: 1 }, 8.7);
    tl.fromTo("#brun-queen-tip", { scale: 0.6, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.7, ease: "elastic.out(1, 0.55)" }, 8.7);
    // hero angle: the camera drops low and pushes in on the queen
    tilt(80, 8.7, 1.6, "power2.inOut");
    aim(4, 7.35, 960, 8.7, 1.8);
    // the others back away
    [["q1", 1], ["k1", -1], ["p1", -1], ["p2", 1]].forEach(([id, d], i) => tl.to("#brun-" + id, { x: "+=" + d * 140, y: "-=60", duration: 0.8, ease: "power2.out" }, 9.3 + i * 0.08));
